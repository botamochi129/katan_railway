<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>勝炭鉄道 Transit Viewer</title>
<style>
:root{--bg:#0f0f1a;--card:#1a1a2e;--border:#2c3e50;--text:#ecf0f1;--muted:#95a5a6;--accent:#e67e22}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Noto Sans JP",system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.5}
header{position:sticky;top:0;z-index:100;background:rgba(26,26,46,.95);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);padding:12px 20px;display:flex;align-items:center;gap:10px}
header::before{content:"⛏️";font-size:20px}
h1{font-size:18px;font-weight:800}.sub{font-size:12px;color:var(--muted);margin-left:auto}
.layout{display:grid;grid-template-columns:300px 1fr;gap:14px;padding:14px}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px}
.sidebar{height:calc(100vh-90px);overflow:auto;padding:10px;display:flex;flex-direction:column;gap:8px}
.search{width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:10px;background:#0f0f1a;color:var(--text);font-size:14px;margin-bottom:6px}
.route{display:flex;gap:10px;padding:10px;border-radius:10px;cursor:pointer;transition:all.2s}
.route:hover{background:rgba(230,126,34,.15)}.route.active{background:rgba(230,126,34,.25);border:2px solid var(--accent)}
.swatch{width:26px;height:9px;border-radius:5px;flex:0 0 auto;margin-top:6px}
.rname{font-weight:700;font-size:14px}.rmeta{font-size:11px;color:var(--muted);margin-top:2px}
.toolbar{display:flex;gap:8px;padding:12px;align-items:center;flex-wrap:wrap}
.btn{padding:8px 16px;border:none;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;background:var(--accent);color:#fff}
.btn:hover{filter:brightness(1.1)}.status{font-size:12px;color:var(--muted);margin-left:auto}
.status.ok{color:#2ecc71}.status.err{color:#e74c3c}
.map{background:radial-gradient(circle at 1px 1px,var(--border) 1px,transparent 0) 0 0/22px 22px,#16213e;height:calc(100vh-260px);overflow:auto}
svg{min-width:1300px;display:block}
.station{fill:var(--card);stroke:var(--accent);stroke-width:2.5}.slabel{font-size:14px;font-weight:700;fill:var(--text)}.sen{font-size:10px;fill:var(--muted)}.sno{font-size:9px;fill:var(--accent)}
.train{cursor:pointer;transition:transform.15s}.train:hover{transform:scale(1.05)}
.tboard{fill:var(--accent);font-size:9px;font-weight:800;fill:#fff;pointer-events:none}
.details{padding:14px}.details h2{font-size:16px;margin-bottom:6px}
.leg{display:flex;gap:5px;flex-wrap:wrap;margin:8px 0}.badge{padding:3px 10px;border-radius:15px;font-size:10px;font-weight:700;color:#fff}
.notice{margin-top:10px;padding:10px;border-radius:10px;background:rgba(230,126,34,.15);border:1px solid var(--accent);font-size:11px;color:var(--muted);line-height:1.4}
.stop{display:grid;grid-template-columns:60px 1fr 70px;gap:8px;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px}
.st-time{font-weight:600}.st-name{font-weight:500}.st-en{font-size:10px;color:var(--muted)}.st-sts{font-size:11px;font-weight:700;text-align:right}
.st-sts.psd{color:var(--muted)}.st-sts.cur{color:var(--accent)}.st-sts.nxt{color:#3498db}
@media(max-width:900px){.layout{grid-template-columns:1fr}.sidebar{height:auto;max-height:35vh}.map{height:450px}.sub{display:none}}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:var(--card)}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
</style>
</head>
<body>
<header><h1>勝炭鉄道</h1><span class="sub">Transit Viewer</span></header>
<div class="layout">
  <aside class="sidebar card">
    <input id="search" class="search" placeholder="路線検索...">
    <div id="routeList"></div>
  </aside>
  <main>
    <section class="card toolbar">
      <button id="reload" class="btn">🔄 更新</button>
      <span id="status" class="status">準備中</span>
    </section>
    <section class="card map"><svg id="svg"></svg></section>
    <section class="card details" id="details"><h2>🚃 列車詳細</h2><p>路線図の列車をクリックしてください</p></section>
  </main>
</div>

<script>
// ========== 設定 ==========
const CONFIG = {
  // ✅ Vercel なら /api/data でプロキシ経由
  API: '', // 相対パスで /api/data を叩く
  UPDATE_INTERVAL: 10000,
  ROUTES: [
    { keys: ['条先周線'], name: '勝炭鉄道 条先周線', color: '#95a5a6' },
    { keys: ['樽尾線'], name: '樽尾線', color: '#3498db' },
    { 
      keys: ['城刈線', '氷原線'], 
      name: '城刈線・氷原線（直通）', 
      color1: '#e67e22', color2: '#9b59b6',
      boundary: '新城|Shinjo||sk01_hw01_ps01_pt01_pk05_hc01'
    }
  ],
  SERVICE_COLORS: {
    '普通': '#d3d3d3', 'Local': '#d3d3d3',
    '快速': '#e74c3c', 'Rapid': '#e74c3c',
    '区間快速': '#3498db', 'SectionRapid': '#3498db',
    '通勤快速': '#e67e22', 'CommRapid': '#e67e22',
    '新快速': '#2ecc71', 'NewRapid': '#2ecc71',
    '急行': '#9b59b6', '特急': '#8e44ad',
    '各停': '#95a5a6', '準急': '#16a085'
  }
};

// ========== 状態管理 ==========
const state = { data: null, routes: [], selected: 0, trains: [], stationMap: {} };
const $ = id => document.getElementById(id);

// ========== ユーティリティ ==========
const escape = s => String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const norm = v => {
  if(v==null)return'';if(Array.isArray(v))return v.map(norm).filter(Boolean).join(' ');
  if(typeof v==='object')return norm(v.ja||v.jp||v.name||v.en||Object.values(v)[0]||'');
  return String(v).replace(/\s+/g,' ').trim();
};
const parseStation = raw => {
  const [namePart,num] = norm(raw).split('||'), parts = (namePart||raw||'').split('|');
  return { ja:(parts[0]||'').trim(), en:(parts[1]||'').trim(), no:(num||'').trim() };
};
const getService = text => {
  for(const k of Object.keys(CONFIG.SERVICE_COLORS)) if((text||'').includes(k)) return k;
  return '普通';
};
const getServiceColor = svc => CONFIG.SERVICE_COLORS[svc] || '#95a5a6';
const shortSvc = svc => ({'快速特急':'快特','快速急行':'快急','通勤急行':'通急','通勤快速':'通快','区間快速':'区快','新快速':'新快','急行':'急','快速':'快','準急':'準','各停':'各','普通':'普'}[Object.keys(CONFIG.SERVICE_COLORS).find(k=>svc?.includes(k))||'']||'列');

// ========== API通信（Vercel プロキシ経由） ==========
async function fetchData() {
  const res = await fetch('/api/data', { cache: 'no-store' });
  if(!res.ok) throw new Error(`HTTP ${res.status}`);
  return await res.json();
}

// ========== 駅名マップ構築 ==========
function buildStationMap(root) {
  const map = {}, seen = new WeakSet();
  function walk(obj) {
    if(!obj||typeof obj!=='object'||seen.has(obj)) return; seen.add(obj);
    if(Array.isArray(obj)) { obj.forEach(walk); return; }
    const name = norm(obj.name||obj.stationName||obj.ja||obj.en||obj[0]||Object.values(obj)[0]);
    if(name && obj.id) map[String(obj.id).trim()] = name;
    if(obj.positions && typeof obj.positions==='object') {
      for(const [id,val] of Object.entries(obj.positions)) {
        if(typeof val==='string' && !/^-?\d+/.test(val)) map[id] = val;
      }
    }
    Object.values(obj).forEach(walk);
  }
  walk(root); return map;
}

// ========== 路線解析 ==========
function parseRoutes(data) {
  const results = [];
  function walk(obj) {
    if(!obj||typeof obj!=='object') return;
    if(Array.isArray(obj.routes)) {
      obj.routes.forEach(route => {
        if(!Array.isArray(route.stations)) return;
        const def = CONFIG.ROUTES.find(d => d.keys.some(k => norm(route.name).includes(k)));
        if(!def) return;
        if(def.boundary) {
          const boundaryIdx = route.stations.findIndex(s => String(s).includes('新城') || String(s).includes('sk01_hw01'));
          results.push({ ...def, stations: route.stations, color: def.color1, boundaryIdx, isThrough: true, raw: route, name: def.name, service: getService(route.name), number: route.number });
        } else {
          results.push({ ...def, stations: route.stations, color: def.color, raw: route, name: def.name, service: getService(route.name), number: route.number });
        }
      });
    }
    Object.values(obj).forEach(walk);
  }
  walk(data);
  const grouped = {};
  results.forEach(r => { if(!grouped[r.name]) grouped[r.name] = r; else if(r.stations.length > grouped[r.name].stations.length) grouped[r.name] = r; });
  return Object.values(grouped).sort((a,b)=>a.name.localeCompare(b.name,'ja'));
}

// ========== 列車位置計算 ==========
function calcPosition(route, svcIdx, side) {
  const stops = side==='left' ? route.stations : [...route.stations].reverse();
  if(stops.length < 2) return { pos: 0, status: 'unknown', stops };
  const dwell=18, run=52, seg=dwell+run, cycle=seg*(stops.length-1);
  const seed = svcIdx*19 + (side==='right'?37:0);
  const t = ((Date.now()/1000)+seed) % cycle;
  const idx = Math.floor(t/seg), rem = t - idx*seg;
  return { pos: rem < dwell ? idx : (idx + Math.min(idx+1, stops.length-1))/2, status: rem < dwell ? 'dwell' : 'running', from: idx, to: Math.min(idx+1, stops.length-1), stops };
}

// ========== 描画：路線リスト ==========
function renderRouteList() {
  const q = $('search').value.toLowerCase();
  const filtered = state.routes.filter(r => r.name.toLowerCase().includes(q) || r.service?.toLowerCase().includes(q));
  $('routeList').innerHTML = filtered.map((r,i) => {
    const idx = state.routes.indexOf(r);
    return `<div class="route ${state.selected===idx?'active':''}" data-i="${idx}">
      <div class="swatch" style="background:${r.color||'#95a5a6'}"></div>
      <div><div class="rname">${escape(r.name)}</div><div class="rmeta">${escape(r.service||'')} ${r.number?`| ${r.number}`:''}</div></div>
    </div>`;
  }).join('') || '<div style="padding:10px;color:var(--muted)">該当なし</div>';
  document.querySelectorAll('.route').forEach(el => el.onclick = () => {
    state.selected = +el.dataset.i; renderRouteList(); renderMap(); renderDetails();
  });
}

// ========== 描画：路線図 ==========
function renderMap() {
  const svg = $('svg'); svg.innerHTML = '';
  const route = state.routes[state.selected];
  if(!route) { svg.setAttribute('viewBox','0 0 1300 700'); svg.innerHTML='<text x="650" y="350" text-anchor="middle" fill="var(--muted)">路線を選択</text>'; return; }
  const cx=620, startY=100, gap=95, bottom=startY+gap*(route.stations.length-1), h=Math.max(700,bottom+150);
  svg.setAttribute('viewBox',`0 0 1300 ${h}`);
  svg.insertAdjacentHTML('beforeend', `<text x="30" y="50" font-size="24" font-weight="800">${escape(route.name)}</text>`);
  if(route.isThrough && route.boundaryIdx != null) {
    if(route.boundaryIdx > 0) svg.insertAdjacentHTML('beforeend', `<line x1="${cx}" y1="${startY}" x2="${cx}" y2="${startY+gap*route.boundaryIdx}" stroke="${route.color1}" stroke-width="7" stroke-linecap="round"/>`);
    if(route.boundaryIdx < route.stations.length-1) svg.insertAdjacentHTML('beforeend', `<line x1="${cx}" y1="${startY+gap*route.boundaryIdx}" x2="${cx}" y2="${bottom}" stroke="${route.color2}" stroke-width="7" stroke-linecap="round"/>`);
  } else {
    svg.insertAdjacentHTML('beforeend', `<line x1="${cx}" y1="${startY}" x2="${cx}" y2="${bottom}" stroke="${route.color||'#95a5a6'}" stroke-width="7" stroke-linecap="round"/>`);
  }
  route.stations.forEach((st,i) => {
    const y = startY + gap*i, s = parseStation(st);
    svg.insertAdjacentHTML('beforeend', `<circle class="station" cx="${cx}" cy="${y}" r="11"/>
      <text class="slabel" x="${cx+200}" y="${y+3}">${escape(s.ja)}</text>
      ${s.en?`<text class="sen" x="${cx+200}" y="${y+17}">${escape(s.en)}</text>`:''}
      ${s.no?`<text class="sno" x="${cx+200}" y="${y+s.en?30:20}">${escape(s.no)}</text>`:''}`);
  });
  state.trains = [];
  ['left','right'].forEach(side => {
    const p = calcPosition(route, 0, side);
    const y = startY + gap * p.pos, xOffset = side==='left' ? -110 : 110;
    const svc = route.service || '普通', color = getServiceColor(svc);
    const idx = state.trains.length;
    state.trains.push({ route, service: svc, side, progress: p, dest: parseStation(p.stops[p.stops.length-1]).ja });
    svg.insertAdjacentHTML('beforeend', `<g class="train" onclick="showDetail(${idx})" transform="translate(${cx+xOffset},${y})">
      <rect class="tboard" x="-28" y="-40" width="56" height="16" rx="4" fill="${color}"/>
      <text class="tboard" x="0" y="-29" text-anchor="middle">${shortSvc(svc)}</text>
      <g class="train-icon"><rect x="-18" y="-12" width="36" height="20" rx="3" fill="${CONFIG.SERVICE_COLORS['普通']}" stroke="${color}" stroke-width="2"/>
      <circle cx="-10" cy="10" r="4" fill="${color}"/><circle cx="10" cy="10" r="4" fill="${color}"/></g>
    </g>`);
  });
}

// ========== 描画：詳細パネル ==========
function renderDetails(idx=null) {
  const panel = $('details');
  if(idx!=null && state.trains[idx]) {
    const t = state.trains[idx], p = t.progress;
    panel.innerHTML = `<h2>${escape(t.service)} → ${escape(t.dest)}</h2>
      <div style="font-size:12px;color:var(--muted);margin-bottom:8px">${escape(t.route.name)} / ${t.side==='left'?'下り':'上り'} / ${p.status==='dwell'?'停車中':'走行中'}</div>
      <div class="leg"><span class="badge" style="background:${getServiceColor(t.service)}">${escape(t.service)}</span></div>
      <div class="notice">位置は時刻ベース推定 / 10秒間隔更新</div>
      <div style="margin-top:12px">${p.stops.map((st,i)=>{
        const s=parseStation(st), cls=i<p.from?'psd':i===p.from&&p.status==='dwell'?'cur':i===p.to&&p.status==='running'?'nxt':'psd';
        const tm = new Date(); tm.setMinutes(tm.getMinutes()+(i-p.from)*3);
        return `<div class="stop"><div class="st-time">${tm.toTimeString().slice(0,5)}</div>
          <div class="st-name">${escape(s.ja)}${s.en?`<div class="st-en">${escape(s.en)}</div>`:''}</div>
          <div class="st-sts ${cls}">${cls==='psd'?'通過':cls==='cur'?'停車': '次駅'}</div></div>`;
      }).join('')}</div>`;
  } else {
    const r = state.routes[state.selected];
    if(!r) { panel.innerHTML='<h2>🚃 列車詳細</h2><p>路線を選択してください</p>'; return; }
    panel.innerHTML = `<h2>${escape(r.name)}</h2><div class="leg"><span class="badge" style="background:${getServiceColor(r.service||'普通')}">${escape(r.service||'普通')}</span></div>
      <div class="notice">左:下り / 右:上り / 直通路線は${r.boundary?'新城駅で色切替':''}</div>`;
  }
}
window.showDetail = idx => renderDetails(idx);

// ========== 初期化 ==========
async function load() {
  $('status').textContent='読込中...'; $('status').className='status';
  try {
    const json = await fetchData();
    state.data = json; state.stationMap = buildStationMap(json); state.routes = parseRoutes(json);
    if(state.selected >= state.routes.length) state.selected = 0;
    renderRouteList(); renderMap(); renderDetails();
    $('status').textContent=`✓ ${state.routes.length}路線`; $('status').className='status ok';
  } catch(e) { console.error(e); $('status').textContent=`✕ ${e.message}`; $('status').className='status err'; }
}

$('reload').onclick = load; $('search').oninput = renderRouteList;
load(); setInterval(renderMap, CONFIG.UPDATE_INTERVAL);
</script>
</body>
</html>
