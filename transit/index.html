<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>勝炭鉄道 Transit Viewer Pro</title>
<link rel="icon" href="data:,">
<style>
:root{--bg:#0b1120;--panel:#151c2c;--line:#2a3452;--ink:#e2e8f0;--muted:#94a3b8;--accent:#0ea5e9;--glow:rgba(14,165,233,.2)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:"Noto Sans JP",system-ui,sans-serif;line-height:1.5;overflow:hidden}
header{position:sticky;top:0;z-index:20;background:rgba(11,17,32,.95);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:12px 20px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px}.logo{width:30px;height:30px;border-radius:6px;background:linear-gradient(135deg,var(--accent),#0369a1);display:grid;place-items:center;color:#fff;font-weight:800;font-size:14px}
h1{margin:0;font-size:20px;font-weight:700}.sub{font-size:11px;color:var(--muted)}
.layout{display:grid;grid-template-columns:320px 1fr;gap:0;height:calc(100vh - 60px)}
.sidebar{background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;padding:16px}
.main{display:grid;grid-template-rows:auto 1fr auto;background:#0f172a;overflow:hidden}
.toolbar{padding:12px;display:flex;gap:8px;align-items:center}
button,input{border:1px solid var(--line);border-radius:8px;background:#0d1324;color:var(--ink);padding:8px 12px;font-size:14px}
.primary{background:var(--accent);color:#0b1120;font-weight:600;cursor:pointer}
.route-item{padding:12px;border-radius:10px;margin-bottom:8px;cursor:pointer;border:1px solid transparent;transition:all .2s}
.route-item:hover{background:rgba(255,255,255,0.05)}
.route-item.active{background:var(--glow);border-color:var(--accent)}
.swatch{width:40px;height:4px;border-radius:2px;margin-bottom:6px}
.map-container{position:relative;overflow:auto;background:radial-gradient(circle at 1px 1px, #1e293b 1px, transparent 0) 0 0/32px 32px}
svg{display:block;min-width:1200px}
.station-node{fill:var(--panel);stroke:var(--accent);stroke-width:3}
.station-text{fill:var(--ink);font-size:14px;font-weight:600}
.station-sub{fill:var(--muted);font-size:11px}
.train-unit{cursor:pointer;transition:filter 0.2s}
.train-unit:hover{filter:brightness(1.3)}
.train-label{font-size:10px;fill:#fff;font-weight:bold;text-anchor:middle}
.branch-path{fill:none;stroke:var(--accent);stroke-width:4;stroke-dasharray:8 4;opacity:0.7}
.details-panel{padding:16px;border-top:1px solid var(--line);background:var(--panel);max-height:300px;overflow-y:auto}
#status{font-size:12px;margin-left:auto}
.ok{color:#10b981}.err{color:#f43f5e}
</style>
</head>
<body>
<header>
  <div class="brand"><div class="logo">SC</div><div><h1>勝炭鉄道</h1><div class="sub">Durations Engine / Branch-Aware</div></div></div>
  <div id="status">システム待機中</div>
</header>
<div class="layout">
  <aside class="sidebar">
    <input id="search" placeholder="路線を検索..." style="width:100%;margin-bottom:16px">
    <div id="routeList"></div>
  </aside>
  <main class="main">
    <div class="toolbar">
      <button class="primary" onclick="loadData()">🔄 更新</button>
      <div id="routeTitle" style="font-weight:bold">路線を選択してください</div>
    </div>
    <div class="map-container">
      <svg id="svgMain"></svg>
    </div>
    <div class="details-panel" id="details">
      <h3>列車詳細</h3>
      <p style="color:var(--muted);font-size:13px">列車を選択すると、予測時刻・位置情報が表示されます。</p>
    </div>
  </main>
</div>

<script>
const CONFIG = {
    DATA_API: "/api/data",
    ARRIVALS_API: "/api/arrivals",
    INTERVAL: 10000,
    KEYWORDS: ["条先周線", "樽尾線", "城刈線", "氷原線"], // "勝炭鉄道" は接頭辞として除外
    BRANCH_KEYWORDS: ["支線", "直通", "線大", "線4", "線徳"] // 分岐・派生路線の識別子
};

let state = {
    allData: null,
    unifiedRoutes: [],
    selectedRouteIdx: 0,
    stationMap: {},
    trains: [],
    pollStations: []
};

// --- ユーティリティ ---
function normalize(str) {
    return String(str || "").split('||')[0].split('|')[0].trim();
}
function colorFromNumber(n, fallback="#94a3b8") {
    if (typeof n !== "number" || !Number.isFinite(n)) return fallback;
    return "#" + (n >>> 0).toString(16).padStart(6, "0").slice(-6);
}
function extractStationName(raw) {
    if (!raw) return { ja: "未認識", en: "", id: "" };
    const s = String(raw);
    const parts = s.split('||');
    const namePart = parts[0];
    const [ja, en] = namePart.split('|');
    const id = parts[1] || "";
    return { ja: (ja || "未認識").trim(), en: (en || "").trim(), id: id.trim() };
}
function getStationDisplay(id) {
    const rawId = String(id).split('_')[0];
    const mapped = state.stationMap[rawId];
    if (mapped) {
        const info = extractStationName(mapped);
        return info.ja + (info.en ? ` <tspan class="station-sub">(${info.en})</tspan>` : "");
    }
    // ID 自体に駅名が含まれる場合のフォールバック
    const fallback = extractStationName(rawId);
    return fallback.ja !== "未認識" ? fallback.ja : rawId;
}
function findStationIndex(route, nameOrId) {
    if (!nameOrId) return -1;
    const target = normalize(nameOrId);
    const targetInfo = extractStationName(nameOrId);
    
    return route.stations.findIndex(sId => {
        const raw = String(sId).split('_')[0];
        const mapped = state.stationMap[raw];
        if (mapped) {
            const info = extractStationName(mapped);
            if (info.ja.includes(target) || target.includes(info.ja)) return true;
            if (info.id && info.id === target) return true;
        }
        // 直接 ID 比較
        if (raw === target || targetInfo.id === raw) return true;
        return false;
    });
}
function detectDirection(arrName) {
    // "普 流→新(→厚)" → {from:"流", to:"新"}
    const match = arrName.match(/([^→\s(]+)→([^→\s(]+)/);
    return match ? { from: match[1].trim(), to: match[2].trim() } : null;
}
function getRouteGroupKey(name) {
    const base = normalize(name);
    // KEYWORDS に含まれるものでグルーピング（"氷原線" で "氷原線大" も含む）
    for (const kw of CONFIG.KEYWORDS) {
        if (base.includes(kw)) return kw;
    }
    return base;
}
function isBranchRoute(name) {
    return CONFIG.BRANCH_KEYWORDS.some(kw => normalize(name).includes(kw));
}

// --- 駅名マップ構築（再帰的・包括的） ---
function buildStationMap(root) {
    const map = {};
    const seen = new WeakSet();
    
    function walk(obj) {
        if (!obj || typeof obj !== 'object' || seen.has(obj)) return;
        seen.add(obj);
        
        // stations 配列からの抽出
        if (Array.isArray(obj.stations)) {
            obj.stations.forEach(s => {
                if (s?.id && s?.name) map[s.id] = s.name;
            });
        }
        // positions/object 形式からの抽出
        if (obj.positions && typeof obj.positions === 'object' && !Array.isArray(obj.positions)) {
            for (const [id, val] of Object.entries(obj.positions)) {
                if (typeof val === 'string' && !/^-?\d+/.test(val) && val.length < 100) {
                    map[id] = val;
                }
            }
        }
        // 汎用オブジェクト走査
        for (const v of Object.values(obj)) {
            if (typeof v === 'object') walk(v);
        }
    }
    walk(root);
    return map;
}

// --- 路線解析・統合（分岐対応） ---
function parseRoutes(data) {
    const groups = {};
    
    function walk(obj) {
        if (!obj || typeof obj !== 'object') return;
        if (Array.isArray(obj.routes)) {
            obj.routes.forEach(r => {
                const baseName = normalize(r.name);
                // KEYWORDS 包含チェック
                const groupKey = CONFIG.KEYWORDS.find(kw => baseName.includes(kw));
                if (!groupKey) return;
                
                const color = colorFromNumber(r.color);
                const isBranch = isBranchRoute(r.name);
                
                if (!groups[groupKey]) {
                    groups[groupKey] = { 
                        name: groupKey, 
                        color, 
                        mainStations: new Map(), // id -> {order, isBranch}
                        branches: new Map(),     // branchName -> [stationIds]
                        durations: new Map(),    // "fromId_toId" -> durationMs
                        rawRoutes: [],
                        services: new Set()
                    };
                }
                
                const g = groups[groupKey];
                g.rawRoutes.push(r);
                g.services.add(normalize(r.route));
                
                // 駅列と durations の登録
                const stations = r.stations || [];
                const durations = r.durations || [];
                
                stations.forEach((stId, i) => {
                    const rawId = String(stId).split('_')[0];
                    const order = g.mainStations.has(rawId) ? g.mainStations.get(rawId).order : i;
                    g.mainStations.set(rawId, { order, isBranch, raw: stId });
                    
                    // durations マッピング
                    if (i < durations.length && i + 1 < stations.length) {
                        const nextRaw = String(stations[i+1]).split('_')[0];
                        const key = `${rawId}_${nextRaw}`;
                        if (!g.durations.has(key)) {
                            g.durations.set(key, durations[i]);
                        }
                    }
                });
                
                // 分岐路線は別トラックに記録
                if (isBranch) {
                    const branchName = baseName.replace(groupKey, "").trim() || "支線";
                    if (!g.branches.has(branchName)) g.branches.set(branchName, []);
                    stations.forEach(st => {
                        const rawId = String(st).split('_')[0];
                        if (!g.branches.get(branchName).includes(rawId)) {
                            g.branches.get(branchName).push(rawId);
                        }
                    });
                }
            });
        }
        Object.values(obj).forEach(v => typeof v === 'object' && walk(v));
    }
    walk(data);
    
    // Route オブジェクトに変換
    return Object.values(groups).map(g => {
        // 主路線: order 順にソート
        const mainStations = Array.from(g.mainStations.entries())
            .sort((a,b) => a[1].order - b[1].order)
            .map(([id, info]) => info.raw);
        
        // 分岐: 各ブランチの駅列を抽出
        const branches = Array.from(g.branches.entries()).map(([name, stationIds]) => ({
            name,
            stations: stationIds.map(id => {
                const info = g.mainStations.get(id);
                return info ? info.raw : id;
            })
        }));
        
        // durations 配列を主路線用に再構築
        const durations = [];
        for (let i = 0; i < mainStations.length - 1; i++) {
            const from = String(mainStations[i]).split('_')[0];
            const to = String(mainStations[i+1]).split('_')[0];
            durations.push(g.durations.get(`${from}_${to}`) || g.durations.get(`${to}_${from}`) || 60000);
        }
        
        return {
            name: g.name,
            color: g.color,
            stations: mainStations,
            durations,
            branches,
            services: Array.from(g.services)
        };
    }).sort((a,b) => a.name.localeCompare(b.name, 'ja'));
}

// --- 列車位置計算（durations 基準＋方向別配置） ---
function calcPositionWithDurations(route, arr, now, monitorIdx) {
    const durations = route.durations;
    const stations = route.stations;
    if (!durations?.length || !stations?.length) {
        return calcPositionFallback(route, arr, now, monitorIdx);
    }
    
    const arrivalTime = Number(arr.arrival);
    
    // 累積時間配列（監視駅基準）
    const cum = new Array(stations.length).fill(0);
    for (let i = monitorIdx; i < durations.length; i++) {
        cum[i+1] = cum[i] + durations[i];
    }
    for (let i = monitorIdx - 1; i >= 0; i--) {
        cum[i] = cum[i+1] - durations[i];
    }
    
    // 各駅の予測到着時刻
    const expected = stations.map((_, i) => arrivalTime + cum[i] - cum[monitorIdx]);
    
    // 現在位置の特定
    for (let i = 0; i < expected.length - 1; i++) {
        if (now >= expected[i] && now < expected[i+1]) {
            const segDur = durations[i] || 60000;
            const progress = Math.max(0, Math.min(1, (now - expected[i]) / segDur));
            return {
                pos: i + progress,
                fromIdx: i,
                toIdx: i + 1,
                status: progress < 0.15 ? "dwell" : "running",
                progress
            };
        }
    }
    
    // 範囲外フォールバック
    if (now < expected[0]) {
        return { pos: 0, fromIdx: 0, toIdx: 1, status: "waiting", progress: 0 };
    }
    return {
        pos: stations.length - 1,
        fromIdx: stations.length - 2,
        toIdx: stations.length - 1,
        status: "arrived",
        progress: 1
    };
}

function calcPositionFallback(route, arr, now, monitorIdx) {
    // durations 未取得時の簡易補間（2 分/駅仮定）
    const timeDiffMin = (arr.arrival - now) / 60000;
    const pos = monitorIdx - (timeDiffMin / 2);
    return {
        pos: Math.max(0, Math.min(route.stations.length - 1, pos)),
        fromIdx: Math.floor(pos),
        toIdx: Math.ceil(pos),
        status: "estimating",
        progress: pos % 1
    };
}

async function updateTrains() {
    const route = state.unifiedRoutes[state.selectedRouteIdx];
    if (!route) return;
    
    // 3 点ポーリング
    const pollPoints = [
        route.stations[0],
        route.stations[Math.floor(route.stations.length / 2)],
        route.stations[route.stations.length - 1]
    ].map(id => String(id).split('_')[0]);
    state.pollStations = pollPoints;
    
    const allArrivals = [];
    for (const sId of new Set(pollPoints)) {
        try {
            const res = await fetch(`${CONFIG.ARRIVALS_API}?stationId=${encodeURIComponent(sId)}&worldIndex=0`);
            if (res.ok) {
                const json = await res.json();
                if (Array.isArray(json)) allArrivals.push(...json);
            }
        } catch (e) { console.error("Poll error", e); }
    }
    
    const now = Date.now();
    const seen = new Set();
    const processedTrains = [];
    const monitorIdx = Math.floor(route.stations.length / 2);
    
    allArrivals.forEach(arr => {
        // 路線名マッチ（グループキー基準）
        const arrBase = normalize(arr.name);
        const routeBase = route.name;
        if (!arrBase.includes(routeBase) && !routeBase.includes(arrBase)) return;
        
        // 重複除去
        const key = `${arr.arrival}_${normalize(arr.destination)}_${normalize(arr.route)}`;
        if (seen.has(key)) return;
        seen.add(key);
        
        // 方向判定（→ から）
        const dir = detectDirection(arr.name);
        const side = dir ? (findStationIndex(route, dir.to) < findStationIndex(route, dir.from) ? 'left' : 'right') : 'right';
        
        // 位置計算
        const posInfo = calcPositionWithDurations(route, arr, now, monitorIdx);
        
        processedTrains.push({
            id: Math.random(),
            dest: extractStationName(arr.destination).ja,
            service: normalize(arr.route).replace(routeBase, "").trim() || "普通",
            side,
            ...posInfo,
            arrival: arr.arrival,
            platform: arr.platform,
            color: colorFromNumber(arr.color),
            raw: arr
        });
    });
    
    state.trains = processedTrains;
    renderMap();
}

// --- SVG 描画（分岐対応） ---
function renderMap() {
    const svg = document.getElementById("svgMain");
    const route = state.unifiedRoutes[state.selectedRouteIdx];
    if (!route) return;
    
    const SPACING = 90;
    const MARGIN = 120;
    const BRANCH_OFFSET = 180;
    const h = Math.max(800, route.stations.length * SPACING + MARGIN * 2 + route.branches.length * 100);
    
    svg.setAttribute("viewBox", `0 0 1200 ${h}`);
    svg.style.height = h + "px";
    
    let html = '';
    
    // 主路線：垂直ライン
    const mainX = 600;
    html += `<line x1="${mainX}" y1="${MARGIN}" x2="${mainX}" y2="${MARGIN + route.stations.length * SPACING}" stroke="${route.color}" stroke-width="10" stroke-linecap="round"/>`;
    
    // 駅描画（主路線）
    route.stations.forEach((sId, i) => {
        const y = MARGIN + i * SPACING;
        html += `<circle class="station-node" cx="${mainX}" cy="${y}" r="9"/>
                 <text class="station-text" x="${mainX + 20}" y="${y + 5}">${getStationDisplay(sId)}</text>`;
    });
    
    // 分岐路線：曲線パス
    route.branches.forEach((branch, bi) => {
        const branchY = MARGIN + route.stations.length * SPACING + bi * 100;
        const branchX = mainX + BRANCH_OFFSET;
        
        // 分岐ライン（曲線）
        html += `<path class="branch-path" d="M ${mainX} ${branchY - 20} Q ${mainX + 60} ${branchY} ${branchX} ${branchY}"/>`;
        
        // 分岐駅
        branch.stations.forEach((sId, i) => {
            const x = branchX + i * 50;
            html += `<circle class="station-node" cx="${x}" cy="${branchY}" r="7" style="stroke-width:2"/>
                     <text class="station-sub" x="${x}" y="${branchY + 20}" text-anchor="middle">${getStationDisplay(sId)}</text>`;
        });
        
        // 分岐ラベル
        html += `<text x="${branchX}" y="${branchY - 30}" text-anchor="middle" fill="${route.color}" font-weight="bold">${branch.name}</text>`;
    });
    
    // 列車描画
    state.trains.forEach(t => {
        const mainY = MARGIN + t.pos * SPACING;
        const x = t.side === 'left' ? mainX - 55 : mainX + 55;
        const y = t.pos >= route.stations.length ? MARGIN + (route.stations.length - 1) * SPACING : mainY;
        
        const shortSvc = t.service.substring(0, 4);
        const onClick = `showTrainDetail(${JSON.stringify({
            dest: t.dest, service: t.service, arrival: t.arrival, 
            platform: t.platform, color: t.color, status: t.status
        }).replace(/"/g, '&quot;')})`;
        
        html += `<g class="train-unit" transform="translate(${x}, ${y})" onclick="${onClick}">
            <rect x="-32" y="-18" width="64" height="36" rx="6" fill="${t.color}" stroke="#fff" stroke-width="2"/>
            <text class="train-label" y="3">${shortSvc}</text>
            <text x="0" y="38" fill="#fff" font-size="10" text-anchor="middle">${t.dest}行</text>
        </g>`;
    });
    
    svg.innerHTML = html;
}

// 詳細パネル表示
window.showTrainDetail = function(t) {
    const panel = document.getElementById("details");
    const eta = new Date(t.arrival);
    const timeStr = eta.toLocaleTimeString('ja-JP', {hour:'2-digit', minute:'2-digit'});
    const statusJa = {dwell:"停車中", running:"走行中", waiting:"始発待機", arrived:"終点到着", estimating:"推定中"}[t.status] || t.status;
    
    panel.innerHTML = `
        <h3>${t.service} ${t.dest}行</h3>
        <p><strong>到着予定:</strong> ${timeStr}</p>
        <p><strong>ホーム:</strong> ${t.platform || '-'}</p>
        <p><strong>状態:</strong> ${statusJa}</p>
        <p style="font-size:11px;color:var(--muted);margin-top:8px">※ 位置・時刻は durations 基準の推定値です</p>
    `;
};

function renderRouteList() {
    const list = document.getElementById("routeList");
    const q = document.getElementById("search").value.toLowerCase();
    
    list.innerHTML = state.unifiedRoutes
        .filter(r => r.name.toLowerCase().includes(q))
        .map((r, i) => `
            <div class="route-item ${state.selectedRouteIdx === i ? 'active' : ''}" onclick="selectRoute(${i})">
                <div class="swatch" style="background:${r.color}"></div>
                <div style="font-weight:bold">${r.name}</div>
                <div style="font-size:11px; color:var(--muted)">
                    ${r.stations.length} 駅 / 種別: ${r.services.slice(0,3).join(', ')}${r.services.length>3?'...':''}
                    ${r.branches.length > 0 ? `<br>🔀 分岐: ${r.branches.map(b=>b.name).join(', ')}` : ''}
                </div>
            </div>
        `).join("") || '<div style="padding:10px;color:var(--muted)">該当する路線がありません</div>';
}

function selectRoute(i) {
    state.selectedRouteIdx = i;
    document.getElementById("routeTitle").innerText = state.unifiedRoutes[i].name;
    renderRouteList();
    updateTrains();
}

async function loadData() {
    const status = document.getElementById("status");
    status.innerText = "データ読込中...";
    status.className = "";
    try {
        const res = await fetch(CONFIG.DATA_API);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        state.stationMap = buildStationMap(data);
        state.unifiedRoutes = parseRoutes(data);
        renderRouteList();
        if (state.unifiedRoutes.length > 0) selectRoute(0);
        status.innerText = `● 接続中 / ${state.unifiedRoutes.length}路線`;
        status.className = "ok";
    } catch (e) {
        console.error("Load error", e);
        status.innerText = "✕ 通信エラー: " + e.message;
        status.className = "err";
    }
}

// 初期化
document.getElementById("search").oninput = renderRouteList;
loadData();
setInterval(updateTrains, CONFIG.INTERVAL);
</script>
</body>
</html>
