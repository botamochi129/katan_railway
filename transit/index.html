<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>勝炭鉄道 Transit Viewer Pro</title>
<style>
:root{--bg:#0b1120;--panel:#151c2c;--line:#2a3452;--ink:#e2e8f0;--muted:#94a3b8;--accent:#0ea5e9}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:sans-serif;overflow:hidden}
.layout{display:grid;grid-template-columns:300px 1fr;height:100vh}
.sidebar{background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;padding:15px}
.main{display:grid;grid-template-rows:60px 1fr 200px;overflow:hidden}
header{padding:0 20px;display:flex;align-items:center;border-bottom:1px solid var(--line);justify-content:space-between}
.map-area{overflow:auto;background:#0f172a;position:relative}
.details{background:var(--panel);border-top:1px solid var(--line);padding:15px;overflow-y:auto}
.route-card{padding:10px;border-radius:8px;margin-bottom:8px;cursor:pointer;border:1px solid transparent;background:rgba(255,255,255,0.03)}
.route-card.active{border-color:var(--accent);background:rgba(14,165,233,0.1)}
svg{display:block}
.station-node{fill:#1e293b;stroke-width:2}
.train-node{cursor:pointer;transition:transform 0.5s linear}
#status{font-size:12px}
.ok{color:#10b981}
</style>
</head>
<body>
<div class="layout">
    <aside class="sidebar">
        <h2 style="font-size:18px;margin-bottom:15px">勝炭鉄道 Viewer</h2>
        <div id="routeList"></div>
    </aside>
    <main class="main">
        <header>
            <div id="currentRouteName" style="font-weight:bold">路線を選択してください</div>
            <div id="status">準備中</div>
        </header>
        <div class="map-area">
            <svg id="svgMap"></svg>
        </div>
        <div class="details" id="details">
            <p style="color:var(--muted)">列車を選択すると詳細な予測時刻表が表示されます。</p>
        </div>
    </main>
</div>

<script>
const CONFIG = {
    DATA_API: "/api/data",
    ARRIVALS_API: "/api/arrivals",
    POLL_COUNT: 5, // 5点ポーリング
    KEYWORDS: ["勝炭鉄道", "条先周線", "樽尾線", "城刈線", "氷原線"],
    EXPRESS_KEYWORDS: ["快速", "特急", "急行", "通勤"]
};

let state = {
    stationMap: {},
    unifiedRoutes: [],
    selectedIdx: 0,
    trains: []
};

// --- 解析エンジン ---
function norm(s) { return String(s || "").split('|')[0].split('||')[0].trim(); }

// --- 解析エンジン（エラー修正版） ---
function norm(s) { return String(s || "").split('|')[0].split('||')[0].trim(); }

function parseData(data) {
    const sMap = {};
    
    // 1. 駅名解決 (Object.values を使い、配列・オブジェクト両方に対応)
    const walkStations = (o) => {
        if (!o || typeof o !== 'object') return;
        
        // stations がオブジェクト(Map)の場合
        if (o.stations && typeof o.stations === 'object' && !Array.isArray(o.stations)) {
            Object.entries(o.stations).forEach(([id, s]) => {
                const name = s.name || s.nameJa || s.n; // MTRのバージョンによる表記揺れ対応
                if (name) sMap[id.split('_')[0]] = name;
            });
        } 
        // stations が配列の場合
        else if (Array.isArray(o.stations)) {
            o.stations.forEach(s => {
                if(s.id && s.name) sMap[s.id.split('_')[0]] = s.name;
            });
        }
        
        // 再帰的に探索
        Object.values(o).forEach(v => {
            if (v && typeof v === 'object') walkStations(v);
        });
    };
    walkStations(data);
    state.stationMap = sMap;

    // 2. 路線合成
    const groups = {};
    const walkRoutes = (o) => {
        if (!o || typeof o !== 'object') return;
        if (Array.isArray(o.routes)) {
            o.routes.forEach(r => {
                if (!CONFIG.KEYWORDS.some(k => r.name.includes(k))) return;
                const bName = norm(r.name);
                const hexColor = (r.color >>> 0).toString(16).padStart(6, '0');
                if (!groups[bName]) groups[bName] = { name: bName, color: `#${hexColor}`, routes: [] };
                groups[bName].routes.push(r);
            });
        }
        Object.values(o).forEach(v => {
            if (v && typeof v === 'object') walkRoutes(v);
        });
    };
    walkRoutes(data);

    state.unifiedRoutes = Object.values(groups).map(g => {
        // 最も駅数が多い系統をメイン(Backbone)にする
        const sorted = g.routes.sort((a, b) => b.stations.length - a.stations.length);
        const backbone = [...sorted[0].stations];
        
        // 分岐点(splitIdx)の特定ロジック
        // 全系統を比較し、共通しなくなる最初の駅を見つける
        let splitIdx = backbone.length;
        if (sorted.length > 1) {
            for (let i = 0; i < backbone.length; i++) {
                const isCommon = sorted.every(r => r.stations[i] === backbone[i]);
                if (!isCommon) {
                    splitIdx = i - 1; // 共通している最後の駅
                    break;
                }
            }
        }

        return { 
            name: g.name, 
            color: g.color, 
            stations: backbone, 
            splitIdx: Math.max(0, splitIdx),
            durations: sorted[0].durations || [],
            rawRoutes: g.routes
        };
    });
}

// --- 位置計算エンジン (5点ポーリング & 補間) ---
async function updateTrains() {
    const route = state.unifiedRoutes[state.selectedIdx];
    if (!route || route.stations.length === 0) return;

    // 5点ポーリング用の駅を選定
    const pollStep = Math.max(1, Math.floor(route.stations.length / (CONFIG.POLL_COUNT - 1)));
    const pollIndices = [];
    for(let i=0; i < CONFIG.POLL_COUNT; i++) {
        const idx = Math.min(i * pollStep, route.stations.length - 1);
        pollIndices.push(idx);
        if (idx === route.stations.length - 1) break;
    }

    const fetchedTrains = [];
    const seen = new Set();
    const now = Date.now();

    await Promise.all([...new Set(pollIndices)].map(async (baseIdx) => {
        const sId = route.stations[baseIdx].split('_')[0];
        try {
            // Vercelプロキシ経由で取得
            const res = await fetch(`${CONFIG.ARRIVALS_API}?stationId=${sId}&worldIndex=0`);
            const arrivals = await res.json();

            if (!Array.isArray(arrivals)) return;

            arrivals.forEach(arr => {
                // 路線名の柔軟な判定 ([快速] 等が入っていても通す)
                const arrRouteName = norm(arr.route);
                if (!arrRouteName.includes(route.name) && !route.name.includes(arrRouteName)) return;

                const key = `${arr.destination}_${arr.arrival}`;
                if (seen.has(key)) return;
                seen.add(key);

                // 到着時刻から全駅の予測通過時刻を算出
                const expected = new Array(route.stations.length).fill(0);
                expected[baseIdx] = Number(arr.arrival);
                
                // baseIdx(取得した駅)を基準に前後の所要時間を加減算
                for(let i = baseIdx + 1; i < route.stations.length; i++) {
                    const dur = route.durations[i-1] || 60000;
                    expected[i] = expected[i-1] + dur;
                }
                for(let i = baseIdx - 1; i >= 0; i--) {
                    const dur = route.durations[i] || 60000;
                    expected[i] = expected[i+1] - dur;
                }

                // 現在位置の特定 (線形補間)
                let pos = -1;
                if (now < expected[0]) {
                    pos = 0; // 始発前
                } else if (now > expected[expected.length - 1]) {
                    pos = expected.length - 1; // 終点通過
                } else {
                    for(let i = 0; i < expected.length - 1; i++) {
                        if (now >= expected[i] && now <= expected[i+1]) {
                            const segmentDuration = expected[i+1] - expected[i];
                            const elapsed = now - expected[i];
                            pos = i + (elapsed / (segmentDuration || 1));
                            break;
                        }
                    }
                }

                if (pos !== -1) {
                    const isExpress = CONFIG.EXPRESS_KEYWORDS.some(k => arr.route.includes(k));
                    const destIdx = route.stations.findIndex(s => {
                        const name = state.stationMap[s.split('_')[0]];
                        return name && norm(name).includes(norm(arr.destination));
                    });
                    
                    // 行き先インデックスと現在地の比較で方向決定
                    const direction = (destIdx !== -1 && destIdx < pos) ? "up" : "down";

                    fetchedTrains.push({
                        dest: norm(arr.destination),
                        service: arrRouteName.replace(route.name, "").replace(/[\[\]]/g, "").trim() || "普通",
                        pos, direction, isExpress, expected, raw: arr
                    });
                }
            });
        } catch(e) { console.error("Poll Error:", e); }
    }));

    state.trains = fetchedTrains;
    render();
}

// --- 描画エンジン ---
function render() {
    const route = state.unifiedRoutes[state.selectedIdx];
    const svg = document.getElementById("svgMap");
    if (!route) return;

    const S = 100; // 駅間隔
    const h = (route.stations.length + 1) * S;
    svg.setAttribute("viewBox", `0 0 1000 ${h}`);
    svg.style.height = h + "px";

    let draw = `<line x1="500" y1="${S}" x2="500" y2="${route.stations.length*S}" stroke="${route.color}" stroke-width="10" stroke-linecap="round" opacity="0.3"/>`;

    // 分岐線の描画
    if (route.splitIdx < route.stations.length) {
        draw += `<line x1="500" y1="${(route.splitIdx+1)*S}" x2="660" y2="${(route.splitIdx+2)*S}" stroke="${route.color}" stroke-width="5" stroke-dasharray="5,5"/>`;
    }

    route.stations.forEach((sId, i) => {
        const y = (i + 1) * S;
        const sName = norm(state.stationMap[sId.split('_')[0]]);
        draw += `<circle class="station-node" cx="500" cy="${y}" r="6" stroke="${route.color}"/>`;
        draw += `<text x="520" y="${y+5}" fill="white" font-size="14" font-weight="bold">${sName}</text>`;
    });

    state.trains.forEach((t, idx) => {
        const y = (t.pos + 1) * S;
        // レーン計算: 方向(上/下) x 種別(普通/優等)
        let x = 500;
        const offset = t.isExpress ? 80 : 40;
        x += (t.direction === "up") ? -offset : offset;
        
        // 分岐点以降のXオフセット
        if (t.pos > route.splitIdx) x += 40;

        draw += `
        <g class="train-node" onclick="showDetail(${idx})" transform="translate(${x},${y})">
            <rect x="-25" y="-15" width="50" height="30" rx="4" fill="${t.isExpress ? '#ef4444' : '#3b82f6'}" stroke="white"/>
            <text x="0" y="4" fill="white" font-size="10" font-weight="bold" text-anchor="middle">${t.service.substring(0,2)}</text>
            <text x="0" y="-20" fill="${t.isExpress ? '#f87171' : '#60a5fa'}" font-size="10" text-anchor="middle">${t.dest}</text>
        </g>`;
    });

    svg.innerHTML = draw;
}

window.showDetail = (idx) => {
    const t = state.trains[idx];
    const route = state.unifiedRoutes[state.selectedIdx];
    let html = `<h3>${t.service} ${t.dest} 行</h3><table style="width:100%;font-size:13px;margin-top:10px">`;
    route.stations.forEach((sId, i) => {
        const time = new Date(t.expected[i]).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
        const isPassed = Date.now() > t.expected[i];
        html += `<tr style="opacity:${isPassed?0.4:1}"><td>${norm(state.stationMap[sId.split('_')[0]])}</td><td align="right">${time}</td></tr>`;
    });
    document.getElementById("details").innerHTML = html + `</table>`;
};

function selectRoute(i) {
    state.selectedIdx = i;
    document.getElementById("currentRouteName").innerText = state.unifiedRoutes[i].name;
    updateTrains();
    const cards = document.querySelectorAll('.route-card');
    cards.forEach((c, idx) => c.className = `route-card ${idx===i?'active':''}`);
}

async function init() {
    const res = await fetch(CONFIG.DATA_API);
    const data = await res.json();
    parseData(data);
    const list = document.getElementById("routeList");
    list.innerHTML = state.unifiedRoutes.map((r, i) => `
        <div class="route-card" onclick="selectRoute(${i})">
            <div style="width:30px;height:4px;background:${r.color};margin-bottom:5px"></div>
            <div style="font-weight:bold;font-size:14px">${r.name}</div>
            <div style="font-size:11px;color:var(--muted)">${r.stations.length} 駅 / ${r.rawRoutes.length} 系統</div>
        </div>
    `).join("");
    if(state.unifiedRoutes.length > 0) selectRoute(0);
    document.getElementById("status").innerHTML = `<span class="ok">● 稼働中</span>`;
}

init();
setInterval(updateTrains, 10000);
</script>
</body>
</html>
