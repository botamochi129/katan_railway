<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>勝炭鉄道 Transit Viewer Pro</title>
<link rel="icon" href="data:,">
<style>
:root{--bg:#0b1120;--panel:#151c2c;--line:#2a3452;--ink:#e2e8f0;--muted:#94a3b8;--accent:#0ea5e9;--glow:rgba(14,165,233,.2)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:"Noto Sans JP",system-ui,sans-serif;line-height:1.5;overflow:hidden}
header{position:sticky;top:0;z-index:20;background:rgba(11,17,32,.95);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:12px 20px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px}.logo{width:30px;height:30px;border-radius:6px;background:linear-gradient(135deg,var(--accent),#0369a1);display:grid;place-items:center;color:#fff;font-weight:800;font-size:14px}
h1{margin:0;font-size:20px;font-weight:700}.sub{font-size:11px;color:var(--muted)}
.layout{display:grid;grid-template-columns:320px 1fr;gap:0;height:calc(100vh - 60px)}
.sidebar{background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;padding:16px}
.main{display:grid;grid-template-rows:auto 1fr auto;background:#0f172a;overflow:hidden}
.toolbar{padding:12px;display:flex;gap:8px;align-items:center}
button,input{border:1px solid var(--line);border-radius:8px;background:#0d1324;color:var(--ink);padding:8px 12px;font-size:14px}
.primary{background:var(--accent);color:#0b1120;font-weight:600;cursor:pointer}
.route-item{padding:12px;border-radius:10px;margin-bottom:8px;cursor:pointer;border:1px solid transparent;transition:all .2s}
.route-item:hover{background:rgba(255,255,255,0.05)}
.route-item.active{background:var(--glow);border-color:var(--accent)}
.swatch{width:40px;height:4px;border-radius:2px;margin-bottom:6px}
.map-container{position:relative;overflow:auto;background:radial-gradient(circle at 1px 1px, #1e293b 1px, transparent 0) 0 0/32px 32px}
svg{display:block;min-width:1100px}
.station-node{fill:var(--panel);stroke:var(--accent);stroke-width:3}
.station-text{fill:var(--ink);font-size:14px;font-weight:600}
.station-sub{fill:var(--muted);font-size:11px}
.train-unit{cursor:pointer;transition:filter 0.2s}
.train-unit:hover{filter:brightness(1.3)}
.train-label{font-size:10px;fill:#fff;font-weight:bold;text-anchor:middle}
.train-img{pointer-events:none}
.branch-label{fill:var(--muted);font-size:13px;font-weight:700;letter-spacing:1px}
.details-panel{padding:16px;border-top:1px solid var(--line);background:var(--panel);max-height:300px;overflow-y:auto}
#status{font-size:12px;margin-left:auto}
.ok{color:#10b981}.err{color:#f43f5e}
</style>
</head>
<body>
<header>
  <div class="brand"><div class="logo">SC</div><div><h1>勝炭鉄道</h1><div class="sub">Multi-Track / 4-Lane Engine</div></div></div>
  <div id="status">システム待機中</div>
</header>
<div class="layout">
  <aside class="sidebar">
    <input id="search" placeholder="路線を検索..." style="width:100%;margin-bottom:16px">
    <div id="routeList"></div>
  </aside>
  <main class="main">
    <div class="toolbar">
      <button class="primary" onclick="loadData()">🔄 更新</button>
      <div id="routeTitle" style="font-weight:bold">路線を選択してください</div>
    </div>
    <div class="map-container">
      <svg id="svgMain"></svg>
    </div>
    <div class="details-panel" id="details">
      <h3>列車詳細</h3>
      <p style="color:var(--muted);font-size:13px">列車を選択すると、予測時刻・位置情報が表示されます。</p>
    </div>
  </main>
</div>

<script>
const CONFIG = {
    DATA_API: "/api/data",
    ARRIVALS_API: "/api/arrivals",
    INTERVAL: 10000,
    KEYWORDS: ["条先周線", "樽尾線", "城刈線", "氷原線"],
    BRANCH_SUFFIXES: ["支線", "線大", "線4", "線徳", "直通"],
    LOCAL_SERVICES: ["普通", "Local", "各停", "各駅停車"]
};

let state = {
    stationMap: {},
    unifiedRoutes: [],
    selectedRouteIdx: 0,
    trains: [],
    pollStations: []
};

// ========== ユーティリティ ==========
function escapeHtml(str){return String(str??"").replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function colorFromNumber(n,f="#94a3b8"){if(typeof n!=="number"||!Number.isFinite(n))return f;return "#"+(n>>>0).toString(16).padStart(6,"0").slice(-6)}
function normalize(str) { return String(str || "").split('||')[0].split('|')[0].trim(); }
function normalizeNameText(v){if(v==null)return"";if(Array.isArray(v))return v.map(normalizeNameText).filter(Boolean).join(" ");if(typeof v==="object")return normalizeNameText(v.ja||v.jp||v.name||v.en||v[0]||Object.values(v)[0]||"");return String(v).replace(/\s+/g," ").trim()}
function isBranch(name){return CONFIG.BRANCH_SUFFIXES.some(s=>normalize(name).includes(s))}

// ========== 駅名マップ構築（ぴぬ鉄道完全準拠） ==========
function discoverStationMap(root){
  const map={},seen=new WeakSet();
  function put(id,name){id=String(id||"").trim();name=normalizeNameText(name);if(id&&name&&name.length<140)map[id]=name}
  function extractName(obj){if(!obj||typeof obj!=="object")return"";for(const k of["name","stationName","displayName","title","text","nameJa","nameJp","name_ja","name_jp","ja","jp","en"])if(obj[k])return normalizeNameText(obj[k]);if(Array.isArray(obj.names))return normalizeNameText(obj.names);if(obj.nameMap)return normalizeNameText(obj.nameMap.ja||obj.nameMap.jp||obj.nameMap.en||Object.values(obj.nameMap)[0]);return""}
  function walk(obj,parentKey=""){if(obj==null||typeof obj!=="object"||seen.has(obj))return;seen.add(obj);if(Array.isArray(obj)){obj.forEach(v=>walk(v,parentKey));return}const own=extractName(obj);if(own){if(obj.id)put(obj.id,own);if(obj.stationId)put(obj.stationId,own);if(obj.platformId)put(obj.platformId,own);if(parentKey)put(parentKey,own)}for(const[k,v]of Object.entries(obj)){if((k==="stations"||k==="platforms"||k==="positions")&&v&&typeof v==="object"&&!Array.isArray(v)){for(const[id,val]of Object.entries(v)){if(typeof val==="string"){if(!/^-?\d+(\.\d+)?[, ]+-?\d+/.test(val))put(id,val)}else if(val&&typeof val==="object"){const n=extractName(val);if(n)put(id,n)}}}walk(v,k)}}walk(root);return map}

function stationCandidates(id){const s=String(id||""),out=[s];s.split(/[_|,;:\/]/).forEach(x=>{if(x)out.push(x)});const nums=s.match(/-?\d{5,}/g);if(nums)out.push(...nums);return[...new Set(out)]}
function stationRawName(id,index){const cands=stationCandidates(id);for(const c of cands)if(state.stationMap[c])return state.stationMap[c];const keys=Object.keys(state.stationMap);for(const c of cands){const hit=keys.find(k=>k&&(c.includes(k)||k.includes(c)));if(hit)return state.stationMap[hit]}return`駅${index+1}`}
function getStationDisplay(id){
  const raw = stationRawName(String(id).split('_')[0], 0);
  const s = raw.split('||')[0].split('|');
  let html = escapeHtml(s[0]);
  if(s[1]) html += `<tspan class="station-sub"> (${escapeHtml(s[1])})</tspan>`;
  return html;
}
function findStationIndex(stations, targetRaw){
  return stations.findIndex(s => stationRawName(String(s).split('_')[0],0).includes(targetRaw) || targetRaw.includes(stationRawName(String(s).split('_')[0],0).split('|')[0]));
}

// ========== 路線解析・トラック分離 ==========
function parseRoutes(data) {
  const groups = {};
  const durationMap = new Map();
  
  function walk(obj) {
    if (!obj || typeof obj !== 'object') return;
    if (Array.isArray(obj.routes)) {
      obj.routes.forEach(r => {
        const base = normalize(r.name);
        const kw = CONFIG.KEYWORDS.find(k => base.includes(k));
        if (!kw) return;
        if (!groups[kw]) groups[kw] = { name: kw, color: colorFromNumber(r.color), rawRoutes: [] };
        groups[kw].rawRoutes.push(r);
        // durations マッピング保存
        if (r.stations && r.durations) {
          for(let i=0;i<r.stations.length-1;i++){
            const k = `${String(r.stations[i]).split('_')[0]}_${String(r.stations[i+1]).split('_')[0]}`;
            durationMap.set(k, r.durations[i]);
          }
        }
      });
    }
    Object.values(obj).forEach(v => typeof v === 'object' && walk(v));
  }
  walk(data);

  return Object.values(groups).map(g => {
    // 本線と支線に分離
    const mainR = g.rawRoutes.filter(r => !isBranch(r.name));
    const branchR = g.rawRoutes.filter(r => isBranch(r.name));
    
    function buildTrack(routes, label, x, labelX) {
      const sorted = routes.sort((a,b) => b.stations.length - a.stations.length);
      if(!sorted.length) return null;
      let backbone = [...sorted[0].stations];
      // 共有駅統合・挿入
      sorted.forEach(r => r.stations.forEach((st,i) => {
        const rid = String(st).split('_')[0];
        if(!backbone.some(b=>String(b).split('_')[0]===rid)){
          const prev = i>0 ? String(r.stations[i-1]).split('_')[0] : null;
          const idx = backbone.findIndex(b=>String(b).split('_')[0]===prev);
          idx!==-1 ? backbone.splice(idx+1,0,st) : backbone.push(st);
        }
      }));
      // durations 再構築
      const durations = [];
      for(let i=0; i<backbone.length-1; i++){
        const f=String(backbone[i]).split('_')[0], t=String(backbone[i+1]).split('_')[0];
        durations.push(durationMap.get(`${f}_${t}`)||durationMap.get(`${t}_${f}`)||60000);
      }
      return { label, stations: backbone, durations, x, labelX };
    }

    const tracks = [];
    tracks.push(buildTrack(mainR, "本線", 500, 680));
    if(branchR.length) tracks.push(buildTrack(branchR, "支線", 660, 840));
    
    return {
      name: g.name,
      color: g.color,
      tracks: tracks.filter(Boolean),
      services: [...new Set(g.rawRoutes.map(r => normalize(r.route)))]
    };
  }).sort((a,b) => a.name.localeCompare(b.name, 'ja'));
}

// ========== 位置計算（durations 基準・→不使用） ==========
function calcPosition(track, arr, now, monitorIdx) {
  const durations = track.durations;
  const stations = track.stations;
  const arrivalTime = Number(arr.arrival);

  const cum = new Array(stations.length).fill(0);
  for(let i=monitorIdx; i<durations.length; i++) cum[i+1] = cum[i] + durations[i];
  for(let i=monitorIdx-1; i>=0; i--) cum[i] = cum[i+1] - durations[i];

  const expected = stations.map((_,i) => arrivalTime + cum[i] - cum[monitorIdx]);
  for(let i=0; i<expected.length-1; i++){
    if(now >= expected[i] && now < expected[i+1]){
      const dur = durations[i] || 60000;
      const progress = Math.max(0, Math.min(1, (now - expected[i]) / dur));
      const pos = i + progress;
      
      // 🚫→不使用: destIdx < pos なら左(上り), 否則右(下り)
      const destRaw = String(arr.destination).split('||')[0];
      const destIdx = findStationIndex(stations, destRaw);
      const side = (destIdx !== -1 && destIdx < pos) ? 'left' : 'right';
      return { pos, side, fromIdx: i, toIdx: i+1, status: progress < 0.15 ? "dwell" : "running" };
    }
  }
  const destRaw = String(arr.destination).split('||')[0];
  const destIdx = findStationIndex(stations, destRaw);
  const pos = now < expected[0] ? 0 : stations.length-1;
  return { pos, side: destIdx < pos ? 'left' : 'right', fromIdx: Math.max(0,pos-1), toIdx: Math.min(pos+1,stations.length-1), status: now < expected[0] ? "waiting" : "arrived" };
}

async function updateTrains() {
  const route = state.unifiedRoutes[state.selectedRouteIdx];
  if (!route) return;

  // 🚂 5点均等ポーリングで列車取りこぼし防止
  const pollCount = 5;
  const step = Math.max(1, Math.floor(route.tracks[0].stations.length / pollCount));
  const pollPoints = [];
  for(let i=0; i<pollCount; i++) pollPoints.push(route.tracks[0].stations[i * step]);
  pollPoints.push(route.tracks[0].stations[route.tracks[0].stations.length-1]);
  state.pollStations = [...new Set(pollPoints.map(id=>String(id).split('_')[0]))];

  const allArrivals = [];
  for(const sId of state.pollStations){
    try{
      const res = await fetch(`${CONFIG.ARRIVALS_API}?stationId=${encodeURIComponent(sId)}&worldIndex=0`);
      if(res.ok){ const j=await res.json(); if(Array.isArray(j)) allArrivals.push(...j); }
    }catch(e){}
  }

  const now = Date.now();
  const seen = new Set();
  state.trains = [];

  allArrivals.forEach(arr => {
    // 🎯 マッチング緩和: キーワード包含 or 行先一致で取得
    const arrBase = normalize(arr.name);
    const kwMatch = CONFIG.KEYWORDS.some(k=>arrBase.includes(k) && route.name.includes(k));
    if(!kwMatch && !normalize(arr.destination).includes(route.name)) return;
    
    const key = `${arr.arrival}_${normalize(arr.destination)}_${normalize(arr.route)}`;
    if(seen.has(key)) return; seen.add(key);

    // トラック割り当て
    let activeTrack = route.tracks[0];
    const destRaw = String(arr.destination).split('||')[0];
    for(const t of route.tracks){
      if(findStationIndex(t.stations, destRaw)!==-1) { activeTrack=t; break; }
    }

    const monitorIdx = Math.floor(activeTrack.stations.length/2);
    const p = calcPosition(activeTrack, arr, now, monitorIdx);
    const service = normalize(arr.route).replace(route.name,"").trim()||"普通";
    const isExpress = !CONFIG.LOCAL_SERVICES.includes(service);

    // 🛤️ 4レーン分離
    // 左: 優等(370) / 普通(440)   右: 普通(560) / 優等(630)
    let laneX;
    if(p.side==='left') laneX = isExpress ? 370 : 440;
    else laneX = isExpress ? 630 : 560;
    // 支線補正
    if(activeTrack !== route.tracks[0]) laneX += 160;

    state.trains.push({
      id: Math.random(), track: activeTrack, dest: normalize(arr.destination),
      service, ...p, x: laneX,
      arrival: arr.arrival, platform: arr.platform, color: colorFromNumber(arr.color)
    });
  });
  renderMap();
}

// ========== 描画 ==========
function renderMap() {
  const svg = document.getElementById("svgMain");
  const route = state.unifiedRoutes[state.selectedRouteIdx];
  if (!route) return;

  const maxStations = Math.max(...route.tracks.map(t=>t.stations.length));
  const SPACING = 90, MARGIN = 120, h = Math.max(800, maxStations * SPACING + MARGIN * 2);
  svg.setAttribute("viewBox", `0 0 1100 ${h}`); svg.style.height = h + "px";

  let html = '';
  route.tracks.forEach(track => {
    const lineEnd = MARGIN + track.stations.length * SPACING;
    html += `<line x1="${track.x}" y1="${MARGIN}" x2="${track.x}" y2="${lineEnd}" stroke="${route.color}" stroke-width="10" stroke-linecap="round"/>`;
    track.stations.forEach((s,i) => {
      const y = MARGIN + i*SPACING;
      html += `<circle class="station-node" cx="${track.x}" cy="${y}" r="8"/><text class="station-text" x="${track.labelX}" y="${y+5}">${getStationDisplay(s)}</text>`;
    });
    html += `<text x="${track.x}" y="${lineEnd+30}" class="branch-label">${track.label}</text>`;
  });

  // 分岐接続線（本線終点↔支線始点）
  if(route.tracks.length > 1) {
    const mEnd = MARGIN + route.tracks[0].stations.length * SPACING;
    const bStart = MARGIN;
    html += `<path d="M ${route.tracks[0].x} ${mEnd} Q ${(route.tracks[0].x+route.tracks[1].x)/2} ${(mEnd+bStart)/2} ${route.tracks[1].x} ${bStart}" fill="none" stroke="${route.color}" stroke-width="6" stroke-dasharray="8 4" opacity="0.6"/>`;
  }

  state.trains.forEach(t => {
    const y = MARGIN + t.pos * 90;
    const onClick = `showTrainDetail(${JSON.stringify({dest:t.dest,service:t.service,arrival:t.arrival,platform:t.platform,color:t.color,status:t.status}).replace(/"/g,'&quot;')})`;
    
    html += `<g class="train-unit" transform="translate(${t.x}, ${y})" onclick="${onClick}">
      <rect x="-28" y="-28" width="56" height="56" rx="8" fill="#151c2c" stroke="${t.color}" stroke-width="2" />
      <image class="train-img" href="/assets/kr3000.png" x="-26" y="-26" width="52" height="52" preserveAspectRatio="xMidYMid meet" />
      <rect x="-24" y="-38" width="48" height="14" rx="4" fill="${t.color}" />
      <text class="train-label" x="0" y="-28" text-anchor="middle">${t.service.substring(0,3)}</text>
    </g>`;
  });
  svg.innerHTML = html;
}

window.showTrainDetail = function(t) {
  const panel = document.getElementById("details");
  const eta = new Date(t.arrival);
  const timeStr = eta.toLocaleTimeString('ja-JP', {hour:'2-digit', minute:'2-digit'});
  const statusJa = {dwell:"停車中", running:"走行中", waiting:"始発待機", arrived:"終点通過"}[t.status]||t.status;
  panel.innerHTML = `<h3>${t.service} ${t.dest}行</h3><p><strong>到着予定:</strong> ${timeStr}</p><p><strong>ホーム:</strong> ${t.platform||'-'}</p><p><strong>状態:</strong> ${statusJa}</p><p style="font-size:11px;color:var(--muted);margin-top:8px">※ 位置・時刻は durations 基準の推定値です</p>`;
};

function renderRouteList() {
  const q = document.getElementById("search").value.toLowerCase();
  document.getElementById("routeList").innerHTML = state.unifiedRoutes
    .filter(r => r.name.toLowerCase().includes(q))
    .map((r, i) => `<div class="route-item ${state.selectedRouteIdx === i ? 'active' : ''}" onclick="selectRoute(${i})">
      <div class="swatch" style="background:${r.color}"></div><div style="font-weight:bold">${r.name}</div>
      <div style="font-size:11px;color:var(--muted)">${r.tracks[0].stations.length}駅 / ${r.services.join(', ')}${r.tracks.length>1?' (支線有)':''}</div>
    </div>`).join("") || '<div style="padding:10px;color:var(--muted)">該当なし</div>';
}

function selectRoute(i) {
  state.selectedRouteIdx = i;
  document.getElementById("routeTitle").innerText = state.unifiedRoutes[i].name;
  renderRouteList(); updateTrains();
}

async function loadData() {
  const status = document.getElementById("status");
  status.innerText = "データ読込中..."; status.className = "";
  try {
    const res = await fetch(CONFIG.DATA_API);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    state.stationMap = discoverStationMap(data);
    state.unifiedRoutes = parseRoutes(data);
    renderRouteList();
    if (state.unifiedRoutes.length > 0) selectRoute(0);
    status.innerText = `● 接続中 / ${state.unifiedRoutes.length}路線`; status.className = "ok";
  } catch (e) {
    status.innerText = "✕ 通信エラー: " + e.message; status.className = "err";
  }
}

document.getElementById("search").oninput = renderRouteList;
loadData();
setInterval(updateTrains, CONFIG.INTERVAL);
</script>
</body>
</html>
