<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>勝炭鉄道 Transit Viewer</title>
<style>
:root{--bg:#0b1120;--surface:#151c2c;--hover:#1e273d;--border:#2a3452;--text:#e2e8f0;--muted:#94a3b8;--accent:#0ea5e9;--glow:rgba(14,165,233,.25);--font:'Noto Sans JP',system-ui,sans-serif;--r:12px;--shadow:0 8px 24px rgba(0,0,0,.4)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--text);line-height:1.5;min-height:100vh}
header{position:sticky;top:0;z-index:50;background:rgba(11,17,32,.95);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);padding:14px 20px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px}.logo{width:32px;height:32px;border-radius:6px;background:linear-gradient(135deg,var(--accent),#0369a1);grid:place-items:center;color:#fff;font-weight:800;font-size:15px}
h1{font-size:18px;font-weight:700;letter-spacing:.5px}.ver{font-size:11px;color:var(--muted);background:var(--surface);padding:2px 8px;border-radius:99px;margin-left:auto}
.layout{display:grid;grid-template-columns:280px 1fr;gap:16px;padding:16px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow)}
.sidebar{height:calc(100vh-100px);overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.search{width:100%;padding:10px 14px;border:1px solid var(--border);border-radius:8px;background:#0d1324;color:var(--text);font-size:14px;outline:none}
.search:focus{border-color:var(--accent);box-shadow:0 0 0 2px var(--glow)}
.route{display:flex;gap:10px;padding:10px;border-radius:8px;cursor:pointer;transition:all .2s;border:1px solid transparent}
.route:hover{background:var(--hover);border-color:var(--border)}.route.active{background:rgba(14,165,233,.12);border-color:var(--accent)}
.swatch{width:8px;height:100%;border-radius:4px;min-height:28px}
.rname{font-weight:600;font-size:14px;line-height:1.3}.rmeta{font-size:11px;color:var(--muted);margin-top:2px}
.toolbar{display:flex;gap:10px;padding:12px;align-items:center;flex-wrap:wrap}
.btn{padding:9px 16px;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;background:var(--accent);color:#0b1120}.btn:hover{filter:brightness(1.15)}
.status{font-size:12px;color:var(--muted);margin-left:auto}.status.ok{color:#34d399}.status.err{color:#f87171}
.map{background:radial-gradient(circle at 1px 1px,var(--border) 1px,transparent 1px) 0 0/20px 20px,#0f1525;height:calc(100vh-280px);overflow:auto}
svg{min-width:1200px;display:block}
.station{fill:var(--surface);stroke:var(--accent);stroke-width:2.5}.slabel{font-size:14px;font-weight:600;fill:var(--text)}
.train-group{cursor:pointer}
.train-hit{cursor:pointer}
.tdest{font-size:9px;font-weight:600;fill:#cbd5e1;pointer-events:none}
.details{padding:16px}.details h2{font-size:16px;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.leg{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.badge{padding:3px 10px;border-radius:99px;font-size:10px;font-weight:700;color:#fff}
.notice{margin-top:12px;padding:10px;border-radius:8px;background:rgba(14,165,233,.08);border:1px solid var(--border);font-size:11px;color:var(--muted);line-height:1.5}
.stop{display:grid;grid-template-columns:55px 1fr 65px;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px}
.st-time{font-weight:600}.st-name{font-weight:500}.st-sts{font-size:11px;font-weight:700;text-align:right}
.st-sts.psd{color:var(--muted)}.st-sts.cur{color:var(--accent)}.st-sts.nxt{color:#3b82f6}
@media(max-width:900px){.layout{grid-template-columns:1fr}.sidebar{height:auto;max-height:40vh}.map{height:400px}}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
</style>
</head>
<body>
<header><div class="brand"><div class="logo">SC</div><h1>勝炭鉄道</h1></div><span class="ver">Transit Viewer v5.1 (Fixed)</span></header>
<div class="layout">
  <aside class="sidebar card"><input id="search" class="search" placeholder="路線検索..."><div id="routeList"></div></aside>
  <main>
    <section class="card toolbar"><button id="reload" class="btn">🔄 更新</button><span id="status" class="status">準備中</span></section>
    <section class="card map"><svg id="svg"></svg></section>
    <section class="card details" id="details"><h2>🚃 列車詳細</h2><p>路線図の列車をクリックしてください</p></section>
  </main>
</div>

<script>
const CONFIG = {
  UPDATE_INTERVAL: 10000,
  ROUTES: [
    { keys: ['条先周線'], name: '勝炭鉄道 条先周線', color: '#94a3b8', monitorIdx: 0 },
    { keys: ['樽尾線'], name: '樽尾線', color: '#3b82f6', monitorIdx: 0 },
    { keys: ['城刈線', '氷原線'], name: '城刈線・氷原線（直通）', color1: '#f59e0b', color2: '#8b5cf6', boundary: '新城', monitorIdx: 0 }
  ]
};

const state = { data: null, routes: [], selected: 0, visibleTrains: [], stationMap: {} };
const $ = id => document.getElementById(id);

const escape = s => String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const norm = v => v==null?'':(Array.isArray(v)?v.map(norm).filter(Boolean).join(' '):(typeof v==='object'?norm(v.ja||v.jp||v.name||v.en||Object.values(v)[0]||''):String(v).replace(/\s+/g,' ').trim()));

// ぴぬ鉄道準拠: 駅名表示は「名前(name)」のみ抽出
function getStationName(raw) {
  if (!raw) return '駅';
  const s = String(raw);
  const main = s.split('||')[0].split('|')[0].trim();
  return main || s;
}

async function fetchData() {
  const res = await fetch('/api/data', { cache: 'no-store' });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return await res.json();
}
async function fetchArrivals(stationId) {
  const res = await fetch(`/api/arrivals?stationId=${stationId}&worldIndex=0`, { cache: 'no-store' });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return await res.json();
}

function discoverStationMap(root) {
  const map = {}, seen = new WeakSet();
  function put(id, name) { id=String(id).trim(); name=norm(name); if(id&&name&&name.length<140) map[id]=name; }
  function extractName(obj) {
    if(!obj||typeof obj!=='object')return'';
    for(const k of['name','stationName','displayName','title','text','nameJa','nameJp','ja','jp','en'])if(obj[k])return norm(obj[k]);
    if(Array.isArray(obj.names))return norm(obj.names);
    if(obj.nameMap)return norm(obj.nameMap.ja||obj.nameMap.jp||obj.nameMap.en||Object.values(obj.nameMap)[0]);
    return'';
  }
  function walk(obj,pk='') {
    if(obj==null||typeof obj!=='object'||seen.has(obj))return;seen.add(obj);
    if(Array.isArray(obj)){obj.forEach(v=>walk(v,pk));return;}
    const own=extractName(obj);if(own){if(obj.id)put(obj.id,own);if(obj.stationId)put(obj.stationId,own);if(pk)put(pk,own);}
    for(const[k,v]of Object.entries(obj)){
      if((k==='stations'||k==='platforms'||k==='positions')&&v&&typeof v==='object'&&!Array.isArray(v)){
        for(const[id,val]of Object.entries(v)){if(typeof val==='string'&&!/^-?\d+(\.\d+)?[, ]+-?\d+/.test(val))put(id,val);else if(val&&typeof val==='object'){const n=extractName(val);if(n)put(id,n);}}
      }
      walk(v,k);
    }
  }
  walk(root); return map;
}

function parseRoutes(root) {
  const grouped = {}, seen = new WeakSet();
  function addRoute(r) {
    if(!r||!Array.isArray(r.stations))return;
    const def = CONFIG.ROUTES.find(d=>d.keys.some(k=>norm(r.name).includes(k)));if(!def)return;
    const baseName=def.name;
    if(!grouped[baseName]) grouped[baseName]={name:baseName, routeColor:def.color||'#94a3b8', stations:[...r.stations], durations:r.durations||[], monitorIdx:def.monitorIdx??0, raw:r, isThrough:!!def.boundary};
    if(r.durations?.length>grouped[baseName].durations.length) grouped[baseName].durations=r.durations;
  }
  function walk(obj){if(obj==null||typeof obj!=='object'||seen.has(obj))return;seen.add(obj);if(Array.isArray(obj)){obj.forEach(walk);return;}if(Array.isArray(obj.routes))obj.routes.forEach(addRoute);Object.values(obj).forEach(walk);}
  walk(root);
  const routes=Object.values(grouped).sort((a,b)=>a.name.localeCompare(b.name,'ja'));
  routes.forEach(r=>{if(r.isThrough){const def=CONFIG.ROUTES.find(d=>d.name===r.name);r.boundaryIdx=r.stations.findIndex(s=>String(s).includes(def.boundary));}});
  return routes;
}

// /arrivals ベース位置推定（範囲外逸脱防止・確実に描画）
function calculatePositionsFromArrivals(route, arrivals, currentTime) {
  const trains = [];
  if(!arrivals?.length) return trains;
  const cumDur = [0];
  route.durations.forEach((d,i)=>cumDur.push(cumDur[i]+d));
  const totalDuration = cumDur[cumDur.length-1] || 60000;
  
  arrivals.forEach((arr, idx) => {
    const timeToArrival = arr.arrival - currentTime; // ms
    const monitor = route.monitorIdx || 0;
    let pos = monitor;
    let status = '接近中';
    
    if(timeToArrival > 0) {
      const progress = Math.min(1, Math.max(0, timeToArrival / totalDuration));
      pos = Math.max(0, monitor - progress * monitor);
      status = '走行中';
    } else {
      const passed = Math.abs(timeToArrival);
      const progress = Math.min(1, passed / totalDuration);
      const remainingStations = route.stations.length - 1 - monitor;
      pos = Math.min(route.stations.length - 1, monitor + progress * remainingStations);
      status = '通過後';
    }
    
    // 確実に表示範囲内に収める
    pos = Math.max(0, Math.min(route.stations.length - 1, pos));
    
    trains.push({ id: idx, dest: arr.destination, platform: arr.platform, pos, status, raw: arr });
  });
  return trains;
}

function renderRouteList() {
  const q=$('search').value.toLowerCase();
  const filtered=state.routes.filter(r=>r.name.toLowerCase().includes(q));
  $('routeList').innerHTML=filtered.map((r,i)=>{
    const idx=state.routes.indexOf(r);
    return `<div class="route ${state.selected===idx?'active':''}" data-i="${idx}"><div class="swatch" style="background:${r.routeColor}"></div><div><div class="rname">${escape(r.name)}</div><div class="rmeta">駅数：${r.stations.length} / 監視駅: ${getStationName(r.stations[r.monitorIdx]||'')}</div></div></div>`;
  }).join('')||'<div style="padding:10px;color:var(--muted)">該当なし</div>';
  document.querySelectorAll('.route').forEach(el=>el.onclick=()=>{state.selected=+el.dataset.i;renderRouteList();renderMap();renderDetails();});
}

async function renderMap() {
  const svg=$('svg'); svg.innerHTML='';
  const route=state.routes[state.selected];
  if(!route){svg.setAttribute('viewBox','0 0 1200 600');svg.innerHTML='<text x="600" y="300" text-anchor="middle" fill="var(--muted)">路線を選択</text>';return;}

  const monitorStation = route.stations[route.monitorIdx] || route.stations[0];
  let arrivals = [];
  try { arrivals = await fetchArrivals(monitorStation); } catch(e) { console.warn('Arrivals fetch failed', e); }

  state.visibleTrains = calculatePositionsFromArrivals(route, arrivals, Date.now());

  const cx=580, startY=80, gap=90, bottom=startY+gap*(route.stations.length-1), h=Math.max(600,bottom+120);
  svg.setAttribute('viewBox',`0 0 1200 ${h}`);
  svg.insertAdjacentHTML('beforeend',`<text x="20" y="45" font-size="20" font-weight="700">${escape(route.name)}</text>`);

  if(route.isThrough && route.boundaryIdx>0){
    svg.insertAdjacentHTML('beforeend',`<line x1="${cx}" y1="${startY}" x2="${cx}" y2="${startY+gap*route.boundaryIdx}" stroke="${CONFIG.ROUTES.find(d=>d.name===route.name)?.color1||'#94a3b8'}" stroke-width="6" stroke-linecap="round"/>`);
    svg.insertAdjacentHTML('beforeend',`<line x1="${cx}" y1="${startY+gap*route.boundaryIdx}" x2="${cx}" y2="${bottom}" stroke="${CONFIG.ROUTES.find(d=>d.name===route.name)?.color2||'#94a3b8'}" stroke-width="6" stroke-linecap="round"/>`);
  } else {
    svg.insertAdjacentHTML('beforeend',`<line x1="${cx}" y1="${startY}" x2="${cx}" y2="${bottom}" stroke="${route.routeColor}" stroke-width="6" stroke-linecap="round"/>`);
  }

  route.stations.forEach((st,i)=>{
    const y=startY+gap*i;
    svg.insertAdjacentHTML('beforeend',`<circle class="station" cx="${cx}" cy="${y}" r="10"/>
      <text class="slabel" x="${cx+190}" y="${y+4}">${escape(getStationName(st))}</text>`);
  });

  // 列車描画（確実に表示・画像フォールバック付き）
  state.visibleTrains.forEach((t,idx)=>{
    const y=startY+gap*t.pos;
    const xOff=60;
    
    const g=document.createElementNS('http://www.w3.org/2000/svg','g');
    g.setAttribute('class','train-group');
    g.setAttribute('transform',`translate(${cx+xOff},${y})`);
    
    // クリック用透明ヒットボックス（最前面）
    const hit=document.createElementNS('http://www.w3.org/2000/svg','rect');
    hit.setAttribute('class','train-hit');
    hit.setAttribute('x','-30');hit.setAttribute('y','-30');hit.setAttribute('width','60');hit.setAttribute('height','60');hit.setAttribute('fill','transparent');
    hit.setAttribute('onclick',`showDetail(${idx})`);
    g.appendChild(hit);

    // 行先テキスト
    const dText=document.createElementNS('http://www.w3.org/2000/svg','text');
    dText.setAttribute('class','tdest');dText.setAttribute('x','0');dText.setAttribute('y','-34');dText.setAttribute('text-anchor','middle');
    dText.textContent=`→${escape(t.dest)}`;
    g.appendChild(dText);

    // 画像アイコン
    const img=document.createElementNS('http://www.w3.org/2000/svg','image');
    img.setAttribute('href','/assets/kr3000.png');
    img.setAttribute('x','-24');img.setAttribute('y','-24');img.setAttribute('width','48');img.setAttribute('height','48');
    img.setAttribute('preserveAspectRatio','xMidYMid meet');
    img.setAttribute('pointer-events','none');
    // 画像読み込み失敗時のフォールバック（背景矩形）
    const fallback=document.createElementNS('http://www.w3.org/2000/svg','rect');
    fallback.setAttribute('x','-24');fallback.setAttribute('y','-24');fallback.setAttribute('width','48');fallback.setAttribute('height','48');
    fallback.setAttribute('rx','8');fallback.setAttribute('fill','#151c2c');fallback.setAttribute('stroke','#0ea5e9');fallback.setAttribute('stroke-width','2');
    fallback.setAttribute('pointer-events','none');
    g.insertBefore(fallback, g.firstChild);
    g.appendChild(img);

    svg.appendChild(g);
  });
}

function renderDetails(idx=null){
  const panel=$('details');
  if(idx!=null && state.visibleTrains[idx]){
    const t=state.visibleTrains[idx];
    panel.innerHTML=`<h2>${escape(t.dest)} 行</h2><div style="font-size:12px;color:var(--muted);margin-bottom:8px">${t.status} / ホーム ${t.platform||'-'}</div><div class="notice">位置は /arrivals 実時刻と /data 区間所要時間から補間。MTR仕様上形式・depot情報は未公開。</div>`;
  } else {
    const r=state.routes[state.selected];if(!r){panel.innerHTML='<h2>🚃 列車詳細</h2><p>路線を選択</p>';return;}
    panel.innerHTML=`<h2>${escape(r.name)}</h2><div class="notice">監視駅: ${getStationName(r.stations[r.monitorIdx]||'')}<br>直通路線は境界駅で色切替</div>`;
  }
}
window.showDetail=idx=>renderDetails(idx);

async function load(){
  $('status').textContent='読込中...';$('status').className='status';
  try{
    const json=await fetchData();
    state.data=json;state.stationMap=discoverStationMap(json);state.routes=parseRoutes(json);
    if(state.selected>=state.routes.length)state.selected=0;
    renderRouteList();await renderMap();renderDetails();
    $('status').textContent=`✓ ${state.routes.length}路線 / 駅 ${Object.keys(state.stationMap).length}`;$('status').className='status ok';
  }catch(e){console.error(e);$('status').textContent=`✕ ${e.message}`;$('status').className='status err';}
}

$('reload').onclick=load;$('search').oninput=renderRouteList;
load(); setInterval(()=>renderMap(), CONFIG.UPDATE_INTERVAL);
</script>
</body>
</html>
