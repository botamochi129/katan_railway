<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>勝炭鉄道 Transit Viewer Pro</title>
<link rel="icon" href="data:,">
<style>
:root{--bg:#0b1120;--panel:#151c2c;--line:#2a3452;--ink:#e2e8f0;--muted:#94a3b8;--accent:#0ea5e9;--glow:rgba(14,165,233,.2)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:"Noto Sans JP",system-ui,sans-serif;line-height:1.5;overflow:hidden}
header{position:sticky;top:0;z-index:20;background:rgba(11,17,32,.95);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:12px 20px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px}.logo{width:30px;height:30px;border-radius:6px;background:linear-gradient(135deg,var(--accent),#0369a1);display:grid;place-items:center;color:#fff;font-weight:800;font-size:14px}
h1{margin:0;font-size:20px;font-weight:700}.sub{font-size:11px;color:var(--muted)}
.layout{display:grid;grid-template-columns:320px 1fr;gap:0;height:calc(100vh - 60px)}
.sidebar{background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;padding:16px}
.main{display:grid;grid-template-rows:auto 1fr auto;background:#0f172a;overflow:hidden}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-bottom:12px}
.toolbar{padding:12px;display:flex;gap:8px;align-items:center}
button,input{border:1px solid var(--line);border-radius:8px;background:#0d1324;color:var(--ink);padding:8px 12px;font-size:14px}
.primary{background:var(--accent);color:#0b1120;font-weight:600;cursor:pointer}
.route-item{padding:12px;border-radius:10px;margin-bottom:8px;cursor:pointer;border:1px solid transparent;transition:all .2s}
.route-item:hover{background:rgba(255,255,255,0.05)}
.route-item.active{background:var(--glow);border-color:var(--accent)}
.swatch{width:40px;height:4px;border-radius:2px;margin-bottom:6px}
.map-container{position:relative;overflow:auto;background:radial-gradient(circle at 1px 1px, #1e293b 1px, transparent 0) 0 0/32px 32px}
svg{display:block;min-width:1000px}
.station-node{fill:var(--panel);stroke:var(--accent);stroke-width:3}
.station-text{fill:var(--ink);font-size:16px;font-weight:700}
.train-unit{cursor:pointer;transition:transform 0.3s ease}
.train-unit:hover{filter:brightness(1.2)}
.train-label{font-size:10px;fill:#fff;font-weight:bold;text-anchor:middle}
.details-panel{padding:16px;border-top:1px solid var(--line);background:var(--panel);max-height:300px;overflow-y:auto}
#status{font-size:12px;margin-left:auto}
.ok{color:#10b981}.err{color:#f43f5e}
</style>
</head>
<body>
<header>
  <div class="brand"><div class="logo">SC</div><div><h1>勝炭鉄道</h1><div class="sub">Unified Transit Engine v3</div></div></div>
  <div id="status">システム待機中</div>
</header>
<div class="layout">
  <aside class="sidebar">
    <input id="search" placeholder="路線を検索..." style="width:100%;margin-bottom:16px">
    <div id="routeList"></div>
  </aside>
  <main class="main">
    <div class="toolbar">
      <button class="primary" onclick="loadData()">🔄 更新</button>
      <div id="routeTitle" style="font-weight:bold">路線を選択してください</div>
    </div>
    <div class="map-container">
      <svg id="svgMain"></svg>
    </div>
    <div class="details-panel" id="details">
      <h3>列車詳細</h3>
      <p style="color:var(--muted);font-size:13px">列車を選択すると、ここに予測時刻が表示されます。</p>
    </div>
  </main>
</div>

<script>
const CONFIG = {
    DATA_API: "/api/data",
    ARRIVALS_API: "/api/arrivals",
    INTERVAL: 10000,
    TIME_PER_STATION_MIN: 2, // 簡易補間用: 1駅あたり2分仮定
    KEYWORDS: ["勝炭鉄道", "条先周線", "樽尾線", "城刈線", "氷原線"]
};

let state = {
    allData: null,
    unifiedRoutes: [],
    selectedRouteIdx: 0,
    stationMap: {},
    trains: [],
    pollStations: []
};

// --- ユーティリティ ---
function normalize(str) {
    return String(str || "").split('||')[0].split('|')[0].trim();
}
function colorFromNumber(n, fallback="#94a3b8") {
    if (typeof n !== "number" || !Number.isFinite(n)) return fallback;
    return "#" + (n >>> 0).toString(16).padStart(6, "0").slice(-6);
}
function getStationName(id) {
    const rawId = String(id).split('_')[0];
    const mapped = state.stationMap[rawId];
    return mapped ? normalize(mapped) : "未認識の駅";
}
function findStationIndex(route, namePart) {
    if (!namePart) return -1;
    const target = normalize(namePart);
    return route.stations.findIndex(sId => {
        const sName = getStationName(sId);
        return sName.includes(target) || target.includes(sName);
    });
}

// --- データ解析・路線合成 ---
function parseData(data) {
    // 1. 駅名マッピング構築
    const sMap = {};
    const walkStations = (obj) => {
        if (!obj || typeof obj !== 'object') return;
        if (obj.stations && Array.isArray(obj.stations)) {
            obj.stations.forEach(s => { if(s.id && s.name) sMap[s.id] = s.name; });
        }
        if (obj.positions && typeof obj.positions === 'object') {
            for (const [id, val] of Object.entries(obj.positions)) {
                if (typeof val === 'string' && !/^-?\d+/.test(val)) sMap[id] = val;
            }
        }
        Object.values(obj).forEach(v => typeof v === 'object' && walkStations(v));
    };
    walkStations(data);
    state.stationMap = sMap;

    // 2. 路線フィルタリング＆グルーピング
    const groups = {};
    const walkRoutes = (obj) => {
        if (!obj || typeof obj !== 'object') return;
        if (obj.routes && Array.isArray(obj.routes)) {
            obj.routes.forEach(r => {
                const isTarget = CONFIG.KEYWORDS.some(k => normalize(r.name).includes(k));
                if (!isTarget) return;
                const baseName = normalize(r.name);
                const color = colorFromNumber(r.color);
                const key = baseName; // 路線名のみでグルーピング（色違いも含める）
                if (!groups[key]) {
                    groups[key] = { name: baseName, color, stations: new Set(), rawRoutes: [] };
                }
                groups[key].rawRoutes.push(r);
                r.stations.forEach(s => groups[key].stations.add(s));
            });
        }
        Object.values(obj).forEach(v => typeof v === 'object' && walkRoutes(v));
    };
    walkRoutes(data);

    // 3. 路線の線形化（駅順序維持）
    state.unifiedRoutes = Object.values(groups).map(g => {
        const sorted = g.rawRoutes.sort((a, b) => b.stations.length - a.stations.length);
        let backbone = [...sorted[0].stations];
        g.rawRoutes.forEach(r => {
            r.stations.forEach((st, i) => {
                if (!backbone.includes(st)) {
                    const prev = r.stations[i-1], next = r.stations[i+1];
                    const pIdx = backbone.indexOf(prev), nIdx = backbone.indexOf(next);
                    if (pIdx !== -1) backbone.splice(pIdx + 1, 0, st);
                    else if (nIdx !== -1) backbone.splice(nIdx, 0, st);
                    else backbone.push(st);
                }
            });
        });
        return {
            name: g.name,
            color: g.color,
            stations: backbone,
            services: [...new Set(g.rawRoutes.map(r => normalize(r.route)))]
        };
    }).sort((a,b) => a.name.localeCompare(b.name, 'ja'));
}

// --- 列車位置計算（arrival基準＋簡易補間） ---
async function updateTrains() {
    const route = state.unifiedRoutes[state.selectedRouteIdx];
    if (!route) return;

    // 3点ポーリング（始点・中間・終点）
    const pollPoints = [
        route.stations[0],
        route.stations[Math.floor(route.stations.length / 2)],
        route.stations[route.stations.length - 1]
    ].map(id => String(id).split('_')[0]);
    state.pollStations = pollPoints;

    const allArrivals = [];
    for (const sId of new Set(pollPoints)) {
        try {
            const res = await fetch(`${CONFIG.ARRIVALS_API}?stationId=${encodeURIComponent(sId)}&worldIndex=0`);
            if (res.ok) {
                const json = await res.json();
                if (Array.isArray(json)) allArrivals.push(...json);
            }
        } catch (e) { console.error("Poll error", e); }
    }

    const now = Date.now();
    const seen = new Set();
    const processedTrains = [];

    allArrivals.forEach(arr => {
        // ✅ 路線名完全一致チェック（||以前のみ比較）
        const arrRouteBase = normalize(arr.name);
        const routeBase = normalize(route.name);
        if (!arrRouteBase.includes(routeBase) && !routeBase.includes(arrRouteBase)) return;

        // 重複除去キー: 到着時刻＋行先＋種別
        const key = `${arr.arrival}_${normalize(arr.destination)}_${normalize(arr.route)}`;
        if (seen.has(key)) return;
        seen.add(key);

        // 監視駅の特定（どのpollPointから返されたか推定）
        const pollStationName = pollPoints.find(pid => {
            const sName = getStationName(pid);
            return arr.name?.includes(sName) || sName.includes(normalize(arr.destination));
        }) || pollPoints[1];
        const pollIdx = route.stations.findIndex(s => String(s).split('_')[0] === pollStationName);
        if (pollIdx < 0) return;

        // 目的地インデックス取得
        const destName = normalize(arr.destination);
        const destIdx = findStationIndex(route, destName);
        const service = normalize(arr.route).replace(routeBase, "").trim() || "普通";

        // 位置補間: arrivalを基準に前後を計算
        const timeDiffMin = (arr.arrival - now) / 60000; // 到着までの差分（分）
        const stationsPerMin = 1 / CONFIG.TIME_PER_STATION_MIN;
        let estimatedPos = pollIdx - (timeDiffMin * stationsPerMin);

        // 範囲クリップ
        estimatedPos = Math.max(0, Math.min(route.stations.length - 1, estimatedPos));

        // 左側通行判定: 目的地が現在位置より前なら左（上り）、後なら右（下り）
        const side = (destIdx >= 0 && destIdx < estimatedPos) ? 'left' : 'right';

        processedTrains.push({
            id: Math.random(),
            dest: destName,
            service,
            pos: estimatedPos,
            side,
            arrival: arr.arrival,
            platform: arr.platform,
            color: colorFromNumber(arr.color),
            raw: arr
        });
    });

    state.trains = processedTrains;
    renderMap();
}

// --- SVG描画 ---
function renderMap() {
    const svg = document.getElementById("svgMain");
    const route = state.unifiedRoutes[state.selectedRouteIdx];
    if (!route) return;

    const SPACING = 100;
    const MARGIN = 150;
    const h = route.stations.length * SPACING + (MARGIN * 2);
    svg.setAttribute("viewBox", `0 0 1000 ${h}`);
    svg.style.height = h + "px";

    let html = `<line x1="500" y1="${MARGIN}" x2="500" y2="${h - MARGIN}" stroke="${route.color}" stroke-width="12" stroke-linecap="round" />`;

    // 駅描画
    route.stations.forEach((sId, i) => {
        const y = MARGIN + (i * SPACING);
        html += `<circle class="station-node" cx="500" cy="${y}" r="8" />
                 <text class="station-text" x="530" y="${y + 6}">${getStationName(sId)}</text>`;
    });

    // 列車描画
    state.trains.forEach(t => {
        const y = MARGIN + (t.pos * SPACING);
        const x = t.side === 'left' ? 460 : 540;
        const shortSvc = t.service.substring(0, 4);
        // ✅ onclickで詳細パネル更新
        const onClick = `showTrainDetail(${JSON.stringify({dest:t.dest,service:t.service,arrival:t.arrival,platform:t.platform,color:t.color}).replace(/"/g, '&quot;')})`;
        
        html += `<g class="train-unit" transform="translate(${x}, ${y})" onclick="${onClick}">
            <rect x="-30" y="-15" width="60" height="30" rx="4" fill="${t.color}" stroke="#fff" stroke-width="2" />
            <text class="train-label" y="4">${shortSvc}</text>
            <text x="0" y="30" fill="#fff" font-size="10" text-anchor="middle">${t.dest}行</text>
        </g>`;
    });

    svg.innerHTML = html;
}

// ✅ 詳細パネル表示関数（グローバルスコープ）
window.showTrainDetail = function(t) {
    const panel = document.getElementById("details");
    const eta = new Date(t.arrival);
    const timeStr = eta.toLocaleTimeString('ja-JP', {hour:'2-digit', minute:'2-digit'});
    panel.innerHTML = `
        <h3>${t.service} ${t.dest}行</h3>
        <p><strong>到着予定:</strong> ${timeStr}</p>
        <p><strong>ホーム:</strong> ${t.platform || '-'}</p>
        <p style="font-size:11px;color:var(--muted);margin-top:8px">※ 位置・時刻は推定値です</p>
    `;
};

function renderRouteList() {
    const list = document.getElementById("routeList");
    const q = document.getElementById("search").value.toLowerCase();
    
    list.innerHTML = state.unifiedRoutes
        .filter(r => r.name.toLowerCase().includes(q))
        .map((r, i) => `
            <div class="route-item ${state.selectedRouteIdx === i ? 'active' : ''}" onclick="selectRoute(${i})">
                <div class="swatch" style="background:${r.color}"></div>
                <div style="font-weight:bold">${r.name}</div>
                <div style="font-size:11px; color:var(--muted)">${r.stations.length} 駅 / 種別: ${r.services.join(', ')}</div>
            </div>
        `).join("") || '<div style="padding:10px;color:var(--muted)">該当する路線がありません</div>';
}

function selectRoute(i) {
    state.selectedRouteIdx = i;
    document.getElementById("routeTitle").innerText = state.unifiedRoutes[i].name;
    renderRouteList();
    updateTrains();
}

async function loadData() {
    const status = document.getElementById("status");
    status.innerText = "データ読込中...";
    status.className = "";
    try {
        const res = await fetch(CONFIG.DATA_API);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        parseData(data);
        renderRouteList();
        if (state.unifiedRoutes.length > 0) selectRoute(0);
        status.innerText = "● 接続中";
        status.className = "ok";
    } catch (e) {
        console.error("Load error", e);
        status.innerText = "✕ 通信エラー: " + e.message;
        status.className = "err";
    }
}

// 初期化
document.getElementById("search").oninput = renderRouteList;
loadData();
setInterval(updateTrains, CONFIG.INTERVAL);
</script>
</body>
</html>
