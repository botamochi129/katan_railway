<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>勝炭鉄道 Transit Viewer Pro</title>
<style>
:root{--bg:#0b1120;--panel:#151c2c;--line:#2a3452;--ink:#e2e8f0;--muted:#94a3b8;--accent:#0ea5e9}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:sans-serif;overflow:hidden}
.layout{display:grid;grid-template-columns:300px 1fr;height:100vh}
.sidebar{background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;padding:15px}
.main{display:grid;grid-template-rows:60px 1fr 180px;overflow:hidden}
header{padding:0 20px;display:flex;align-items:center;border-bottom:1px solid var(--line);justify-content:space-between;background:rgba(11,17,32,0.9)}
.map-area{overflow:auto;background:#0f172a;position:relative;scroll-behavior: smooth}
.details{background:var(--panel);border-top:1px solid var(--line);padding:15px;overflow-y:auto;font-size:13px}
.route-card{padding:12px;border-radius:8px;margin-bottom:8px;cursor:pointer;border:1px solid transparent;background:rgba(255,255,255,0.03);transition:0.2s}
.route-card.active{border-color:var(--accent);background:rgba(14,165,233,0.15)}
svg{display:block;background-image: radial-gradient(#1e293b 1px, transparent 1px);background-size: 40px 40px;}
.station-node{fill:#0f172a;stroke-width:3}
.station-label{fill:white;font-size:14px;font-weight:bold;paint-order: stroke;stroke: #0f172a;stroke-width: 4px;stroke-linecap: round;stroke-linejoin: round;}
.train-icon{transition: transform 0.5s linear; cursor: pointer;}
#status{font-size:12px}
.ok{color:#10b981}
</style>
</head>
<body>
<div class="layout">
    <aside class="sidebar">
        <h2 style="font-size:18px;margin-bottom:15px;display:flex;align-items:center;gap:10px">
            <div style="width:12px;height:12px;background:var(--accent);border-radius:2px"></div>勝炭鉄道
        </h2>
        <div id="routeList"></div>
    </aside>
    <main class="main">
        <header>
            <div id="currentRouteName" style="font-weight:bold;font-size:18px">路線を選択してください</div>
            <div id="status">読込中...</div>
        </header>
        <div class="map-area" id="mapArea">
            <svg id="svgMap"></svg>
        </div>
        <div class="details" id="details">
            <p style="color:var(--muted)">列車を選択すると詳細な予測時刻表が表示されます。</p>
        </div>
    </main>
</div>

<script>
const CONFIG = {
    DATA_API: "/api/data",
    ARRIVALS_API: "/api/arrivals",
    TRAIN_IMG: "/assets/kr3000.png",
    POLL_COUNT: 5,
    KEYWORDS: ["勝炭鉄道", "条先周線", "樽尾線", "城刈線", "氷原線"],
    EXPRESS_KEYWORDS: ["快速", "特急", "急行", "新快速", "通勤"]
};

let state = { stationMap: {}, unifiedRoutes: [], selectedIdx: 0, trains: [] };

function norm(s) { return String(s || "").split('|')[0].split('||')[0].trim(); }

// --- データ解析・統合 ---
function parseData(data) {
    const sMap = {};
    const walkStations = (o) => {
        if (!o || typeof o !== 'object') return;
        if (o.stations && typeof o.stations === 'object' && !Array.isArray(o.stations)) {
            Object.entries(o.stations).forEach(([id, s]) => { sMap[id.split('_')[0]] = s.name || s.nameJa; });
        } else if (Array.isArray(o.stations)) {
            o.stations.forEach(s => { if(s.id) sMap[s.id.split('_')[0]] = s.name; });
        }
        Object.values(o).forEach(v => v && typeof v === 'object' && walkStations(v));
    };
    walkStations(data);
    state.stationMap = sMap;

    const groups = {};
    const walkRoutes = (o) => {
        if (!o || typeof o !== 'object') return;
        if (Array.isArray(o.routes)) {
            o.routes.forEach(r => {
                const bName = CONFIG.KEYWORDS.find(k => r.name.includes(k));
                if (!bName) return;
                if (!groups[bName]) groups[bName] = { name: bName, color: `#${(r.color >>> 0).toString(16).padStart(6,'0')}`, routes: [] };
                groups[bName].routes.push(r);
            });
        }
        Object.values(o).forEach(v => v && typeof v === 'object' && walkRoutes(v));
    };
    walkRoutes(data);

    state.unifiedRoutes = Object.values(groups).map(g => {
        // 本線(最長)と支線を特定
        const sorted = g.routes.sort((a, b) => b.stations.length - a.stations.length);
        const backbone = sorted[0].stations; // A-Z
        
        // 分岐点(O駅)の検出
        let splitIdx = backbone.length;
        let branchStations = [];
        const branchRoute = sorted.find(r => !r.stations.every(s => backbone.includes(s)));
        
        if (branchRoute) {
            for (let i = 0; i < branchRoute.stations.length; i++) {
                if (!backbone.includes(branchRoute.stations[i])) {
                    splitIdx = i - 1;
                    branchStations = branchRoute.stations.slice(i);
                    break;
                }
            }
        }

        return { 
            name: g.name, color: g.color, 
            backbone, branchStations, splitIdx, 
            durations: sorted[0].durations || [],
            allRoutes: g.routes
        };
    });
}

// --- 位置計算・5点ポーリング ---
async function updateTrains() {
    const route = state.unifiedRoutes[state.selectedIdx];
    if (!route) return;

    const pollIndices = [0, Math.floor(route.backbone.length/2), route.backbone.length-1];
    if (route.branchStations.length > 0) pollIndices.push(route.backbone.length); // 支線末端

    const fetchedTrains = [];
    const seen = new Set();
    const now = Date.now();

    await Promise.all(pollIndices.map(async (bIdx) => {
        const sId = bIdx < route.backbone.length ? route.backbone[bIdx] : route.branchStations[route.branchStations.length-1];
        try {
            const res = await fetch(`${CONFIG.ARRIVALS_API}?stationId=${sId.split('_')[0]}&worldIndex=0`);
            const arrivals = await res.json();
            if (!Array.isArray(arrivals)) return;

            arrivals.forEach(arr => {
                if (!norm(arr.route).includes(route.name)) return;
                const key = `${arr.destination}_${arr.arrival}`;
                if (seen.has(key)) return;
                seen.add(key);

                // 補完エンジン: 全駅予測時刻計算
                const isBranchTrain = route.branchStations.some(s => norm(state.stationMap[s.split('_')[0]]) === norm(arr.destination));
                const currentStations = isBranchTrain 
                    ? [...route.backbone.slice(0, route.splitIdx + 1), ...route.branchStations]
                    : route.backbone;

                const expected = new Array(currentStations.length).fill(0);
                const matchIdx = currentStations.findIndex(s => norm(state.stationMap[s.split('_')[0]]) === norm(arr.station));
                if (matchIdx === -1) return;

                expected[matchIdx] = Number(arr.arrival);
                for(let i = matchIdx + 1; i < currentStations.length; i++) expected[i] = expected[i-1] + 60000; // 簡易
                for(let i = matchIdx - 1; i >= 0; i--) expected[i] = expected[i+1] - 60000;

                let pos = -1;
                for(let i=0; i<expected.length-1; i++) {
                    if (now >= expected[i] && now <= expected[i+1]) {
                        pos = i + (now - expected[i]) / (expected[i+1] - expected[i]);
                        break;
                    }
                }
                if (now < expected[0]) pos = 0;
                if (now > expected[expected.length-1]) pos = expected.length-1;

                const destIdx = currentStations.findIndex(s => norm(state.stationMap[s.split('_')[0]]) === norm(arr.destination));
                
                fetchedTrains.push({
                    dest: norm(arr.destination),
                    service: norm(arr.route).replace(route.name, "").replace(/[\[\]]/g, "").trim() || "普通",
                    pos, 
                    isBranchTrain,
                    direction: (destIdx < pos) ? "up" : "down",
                    isExpress: CONFIG.EXPRESS_KEYWORDS.some(k => arr.route.includes(k)),
                    expected, stationNames: currentStations.map(s => norm(state.stationMap[s.split('_')[0]]))
                });
            });
        } catch(e) {}
    }));
    state.trains = fetchedTrains;
    render();
}

// --- SVG描画 ---
function render() {
    const route = state.unifiedRoutes[state.selectedIdx];
    const svg = document.getElementById("svgMap");
    if (!route) return;

    const S = 100; // 駅間隔
    const h = (Math.max(route.backbone.length, route.splitIdx + route.branchStations.length) + 2) * S;
    svg.setAttribute("viewBox", `0 0 1000 ${h}`);
    svg.style.height = h + "px";

    let draw = "";
    const getXY = (idx, isBranch) => {
        if (!isBranch || idx <= route.splitIdx) return { x: 400, y: (idx + 1) * S };
        return { x: 600, y: (idx + 1) * S };
    };

    // 線路
    draw += `<path d="M 400 ${S} L 400 ${(route.backbone.length)*S}" stroke="${route.color}" stroke-width="12" fill="none" stroke-linecap="round" opacity="0.3"/>`;
    if (route.branchStations.length > 0) {
        const splitPos = getXY(route.splitIdx, false);
        draw += `<path d="M ${splitPos.x} ${splitPos.y} L 600 ${(route.splitIdx + 2)*S} L 600 ${(route.splitIdx + route.branchStations.length + 1)*S}" stroke="${route.color}" stroke-width="8" fill="none" stroke-dasharray="10,5" opacity="0.5"/>`;
    }

    // 駅
    route.backbone.forEach((s, i) => {
        const p = getXY(i, false);
        draw += `<circle class="station-node" cx="${p.x}" cy="${p.y}" r="7" stroke="${route.color}"/>`;
        draw += `<text class="station-label" x="${p.x - 20}" y="${p.y + 5}" text-anchor="end">${norm(state.stationMap[s.split('_')[0]])}</text>`;
    });
    route.branchStations.forEach((s, i) => {
        const p = getXY(route.splitIdx + 1 + i, true);
        draw += `<circle class="station-node" cx="${p.x}" cy="${p.y}" r="6" stroke="${route.color}" stroke-dasharray="2,2"/>`;
        draw += `<text class="station-label" x="${p.x + 20}" y="${p.y + 5}">${norm(state.stationMap[s.split('_')[0]])}</text>`;
    });

    // 列車
    state.trains.forEach((t, idx) => {
        const p = getXY(t.pos, t.isBranchTrain);
        const xSide = t.direction === "up" ? -45 : 45;
        const scale = t.direction === "up" ? "scaleX(-1)" : "scaleX(1)";

        draw += `
        <g class="train-icon" onclick="showDetail(${idx})" transform="translate(${p.x + xSide}, ${p.y})">
            <image href="${CONFIG.TRAIN_IMG}" x="-30" y="-30" width="60" height="60" style="transform:${scale}; transform-origin: center;"/>
            <rect x="-20" y="-45" width="40" height="16" rx="3" fill="${t.isExpress?'#ef4444':'#3b82f6'}" opacity="0.9"/>
            <text x="0" y="-33" fill="white" font-size="10" font-weight="bold" text-anchor="middle">${t.service}</text>
            <text x="0" y="42" fill="white" font-size="11" font-weight="bold" text-anchor="middle" style="paint-order:stroke; stroke:#0f172a; stroke-width:3px;">${t.dest}</text>
        </g>`;
    });

    svg.innerHTML = draw;
}

window.showDetail = (idx) => {
    const t = state.trains[idx];
    let html = `<h3 style="margin-bottom:10px">${t.service} | ${t.dest} 行</h3><div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">`;
    t.stationNames.forEach((name, i) => {
        const time = new Date(t.expected[i]).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
        const isPassed = Date.now() > t.expected[i];
        html += `<div style="opacity:${isPassed?0.3:1}; border-bottom:1px solid #2a3452; padding:4px 0;">${name}</div>
                 <div style="opacity:${isPassed?0.3:1}; border-bottom:1px solid #2a3452; padding:4px 0; text-align:right">${time}</div>`;
    });
    document.getElementById("details").innerHTML = html + `</div>`;
};

async function init() {
    try {
        const res = await fetch(CONFIG.DATA_API);
        const data = await res.json();
        parseData(data);
        const list = document.getElementById("routeList");
        list.innerHTML = state.unifiedRoutes.map((r, i) => `
            <div class="route-card ${i===0?'active':''}" onclick="selectRoute(${i})">
                <div style="width:40px;height:4px;background:${r.color};margin-bottom:8px;border-radius:2px"></div>
                <div style="font-weight:bold">${r.name}</div>
                <div style="font-size:11px;color:var(--muted);margin-top:4px">本線 ${r.backbone.length}駅 / 支線 ${r.branchStations.length}駅</div>
            </div>
        `).join("");
        if(state.unifiedRoutes.length > 0) selectRoute(0);
        document.getElementById("status").innerHTML = `<span class="ok">● ライブ中</span>`;
    } catch(e) { document.getElementById("status").innerText = "接続エラー"; }
}

function selectRoute(i) {
    state.selectedIdx = i;
    document.getElementById("currentRouteName").innerText = state.unifiedRoutes[i].name;
    document.querySelectorAll('.route-card').forEach((c, idx) => c.classList.toggle('active', idx === i));
    updateTrains();
}

init();
setInterval(updateTrains, 5000); // 5秒ごとに更新
</script>
</body>
</html>
